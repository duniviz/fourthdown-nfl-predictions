name: Wednesday weather model review
on:
  workflow_dispatch:
  schedule:
    - cron: '45 15 * * 3'
permissions:
  contents: write
concurrency:
  group: weather-wednesday-review
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ML research dependencies
        run: python -m pip install numpy scikit-learn
      - name: Test ML challenger safety
        run: python -m unittest discover -s tests -p 'test_ml_challengers.py' -v
      - name: Train and evaluate ML challengers
        run: python -m tools.ml_challengers
      - name: Evaluate verified frozen weather versus baseline projections
        run: python tools/weather_wednesday_review.py
      - name: Verify research-only and no automatic promotion
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/weather-wednesday-review.json'))
          assert d['research_only'] is True
          assert d['production_changed'] is False
          assert d['automatic_promotion'] is False
          assert all(x['samples']>0 for x in d['markets'].values())
          ml=json.load(open('data/ml-challenger-review.json'))
          assert ml['research_only'] and not ml['production_changed'] and not ml['automatic_promotion']
          PY
      - name: Publish Wednesday review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather-wednesday-review.json data/ml-challenger-review.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish Wednesday weather accuracy comparison"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
