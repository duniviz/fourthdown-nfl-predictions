name: Backtest NFL player projections
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/player-backtest-refresh.txt'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-backtest.txt
      - name: Run 2024 and 2025 walk-forward tests
        run: python -m live.backtest_players
      - name: Publish backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/backtests/player-summary.json data/backtests/player-predictions.csv
          git diff --cached --quiet || git commit -m "Publish historical player model backtest results"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: player-model-backtest
          path: data/backtests/
