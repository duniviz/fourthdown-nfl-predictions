name: V4 Player Prop Challenger Screen
on:
  workflow_dispatch:
  push:
    branches:
      - research/challenger-metrics-2026
    paths:
      - 'research/v4_ensemble_screen.py'
      - 'live/backtest_players.py'
      - '.github/workflows/v4-player-challenger-screen.yml'
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/challenger-metrics-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backtest.txt
      - name: Compare challenger to stronger baseline on paired historical rows
        run: python -m research.v4_ensemble_screen
      - name: Publish research results to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v4-screening/results.json research/v4-screening/RESULTS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record V4 ensemble holdout screening results"
            git pull --rebase origin research/challenger-metrics-2026
            git push origin HEAD:research/challenger-metrics-2026
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-player-challenger-screen
          path: research/v4-screening/
          if-no-files-found: warn
