name: Test pregame capture
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_pregame_snapshots.py'
      - 'scripts/check_pregame_kickoff_window.py'
      - 'tests/test_player_ml_snapshot_end_to_end.py'
      - '.github/workflows/capture-pregame-snapshots.yml'
      - 'tools/weather_adjustment_template.py'
      - 'tests/test_capture_pregame_snapshots.py'
      - 'tests/test_weather_adjustment_template.py'
      - '.github/workflows/test-pregame-capture.yml'
  pull_request:
    paths:
      - 'scripts/capture_pregame_snapshots.py'
      - 'scripts/check_pregame_kickoff_window.py'
      - 'tests/test_player_ml_snapshot_end_to_end.py'
      - '.github/workflows/capture-pregame-snapshots.yml'
      - 'tests/test_capture_pregame_snapshots.py'
      - 'tests/test_gb_car_pregame.py'
      - '.github/workflows/test-pregame-capture.yml'
      - 'live/pregame_capture_guard.py'
      - 'live/game_official_pregame_locks.py'
      - 'live/game_pregame_observations.py'
      - 'live/pregame_cycle.py'
      - 'live/dk_identity.py'
      - 'live/dk_archive.py'
      - 'live/dk_game_refresh.py'
      - 'tools/refresh_parlayapi_odds.py'
      - 'tools/refresh_sportsgameodds_backup.py'
      - 'assets/dk-lines.js'
      - 'assets/dk-markets.json'
      - 'tests/test_dk_lines_frontend.js'
      - 'tests/test_dk_prop_snapshot_merge.py'
      - 'tests/test_game_pregame_observations.py'
      - 'tests/test_pregame_capture_guard.py'
      - 'tests/test_game_official_pregame_locks.py'
      - '.github/workflows/capture-game-pregame.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run snapshot unit tests
        run: python -m unittest discover -s tests -p 'test_capture_pregame_snapshots.py' -v
      - name: Test frontend DraftKings identity and freshness
        run: node tests/test_dk_lines_frontend.js
      - name: Test saved odds through capture and grading
        run: python -m unittest discover -s tests -p 'test_pregame_end_to_end.py' -v
      - name: Test player ML and DK snapshot persistence end to end
        run: python -m unittest discover -s tests -p 'test_player_ml_snapshot_end_to_end.py' -v
      - name: Test real GB-CAR historical regression
        run: python -m unittest discover -s tests -p 'test_gb_car_pregame.py' -v
      - name: Audit Week 7 and Week 8 completed games
        run: python scripts/audit_completed_games.py
      - name: Validate Python syntax
        run: python -m py_compile scripts/capture_pregame_snapshots.py

      - name: Validate T-30 slate and T-15 official lock
        run: python -m unittest tests.test_pregame_capture_guard tests.test_game_official_pregame_locks -v
  merge-validated-lock:
    needs: test
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 343 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/official-t15-game-testing-locks' && github.event.pull_request.user.login == 'duniviz' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR after all tests pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
