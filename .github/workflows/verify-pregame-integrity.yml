name: Verify pregame capture integrity
on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify recently started games
        run: python -m live.pregame_integrity
