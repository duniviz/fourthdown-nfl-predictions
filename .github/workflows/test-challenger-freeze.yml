name: Test challenger freeze
on:
  pull_request:
    paths:
      - 'scripts/freeze_*'
      - 'tests/test_freeze_challenger_timing.py'
      - '.github/workflows/freeze-game-ml-challengers.yml'
      - '.github/workflows/test-challenger-freeze.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/freeze_*'
      - 'tests/test_freeze_challenger_timing.py'
      - '.github/workflows/freeze-game-ml-challengers.yml'
      - '.github/workflows/test-challenger-freeze.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scikit-learn
      - run: python -m unittest discover -s tests -p 'test_freeze_challenger_timing.py' -v
