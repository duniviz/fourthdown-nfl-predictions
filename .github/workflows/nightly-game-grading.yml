name: Grade completed NFL game predictions at 11 PM Central

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nightly-game-grading.yml'
      - 'live/game_official_results.py'
      - 'scripts/check_pregame_forecast_window.py'
      - 'tests/test_game_official_results.py'
      - 'scripts/postgame_evidence_coverage.py'
      - 'tests/test_postgame_evidence_coverage.py'
  schedule:
    # 11 PM Central, including daylight saving time.
    - cron: '0 23 * * *'
      timezone: America/Chicago

permissions:
  contents: write

concurrency:
  group: nightly-game-grading
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free schedule-data dependencies
        run: python -m pip install -r requirements-backtest.txt
      - name: Test game grading safeguards
        run: python -m unittest discover -s tests -p 'test_game_official_results.py' -v
      - name: Test read-only postgame evidence coverage
        run: python -m unittest discover -s tests -p 'test_postgame_evidence_coverage.py' -v
      - name: Select the 11 PM Central run
        id: window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif python -m live.game_official_results --due --event "${{ github.event_name }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping nightly grading; a grade has already been published since 11 PM Central."
          fi
      - name: Grade completed games against frozen pregame forecasts
        if: steps.window.outputs.run == 'true'
        run: python -m live.game_official_results
      - name: Validate and summarize published game results
        if: steps.window.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("data/game-official-results.json").read_text())
          required = {"generated_at_utc", "graded_games", "summary", "rows"}
          missing = required - result.keys()
          if missing:
              raise SystemExit(f"Game-grading output is missing fields: {sorted(missing)}")
          if not isinstance(result["rows"], list) or result["graded_games"] != len(result["rows"]):
              raise SystemExit("Game-grading output count does not match its rows")
          print(f"Validated {result['graded_games']} completed frozen game records.")
          for market in ("winner", "ats", "ou"):
              print(f"{market}: {result['summary'][market]}")
          PY
      - name: Commit refreshed History results
        if: steps.window.outputs.run == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-official-results.json
          if ! git diff --cached --quiet; then
            git commit -m "data: grade completed frozen game predictions"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Game results are unchanged; nothing to publish."
          fi
      - name: Audit frozen evidence coverage after grading
        if: steps.window.outputs.run == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        run: python -m scripts.postgame_evidence_coverage
      - name: Upload read-only postgame coverage report
        if: always() && steps.window.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: postgame-evidence-coverage
          path: artifacts/postgame-coverage.json
          if-no-files-found: warn
          retention-days: 30
