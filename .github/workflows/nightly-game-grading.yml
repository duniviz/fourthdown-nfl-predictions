name: Grade completed NFL game predictions at 11 PM Central

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nightly-game-grading.yml'
      - 'live/game_official_results.py'
      - 'tests/test_game_official_results.py'
  schedule:
    # GitHub cron is UTC. The local-time gate below chooses 04:00 UTC during
    # daylight time and 05:00 UTC during standard time, both 11 PM Central.
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'

permissions:
  contents: write

concurrency:
  group: nightly-game-grading
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free schedule-data dependencies
        run: python -m pip install -r requirements-backtest.txt
      - name: Test game grading safeguards
        run: python -m unittest discover -s tests -p 'test_game_official_results.py' -v
      - name: Select the 11 PM Central run
        id: window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" != "schedule" ]] || [[ "$(TZ=America/Chicago date +%H)" == "23" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the duplicate UTC schedule; the other cron entry is the 11 PM Central run."
          fi
      - name: Grade completed games against frozen pregame forecasts
        if: steps.window.outputs.run == 'true'
        run: python -m live.game_official_results
      - name: Validate and summarize published game results
        if: steps.window.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("data/game-official-results.json").read_text())
          required = {"generated_at_utc", "graded_games", "summary", "rows"}
          missing = required - result.keys()
          if missing:
              raise SystemExit(f"Game-grading output is missing fields: {sorted(missing)}")
          if not isinstance(result["rows"], list) or result["graded_games"] != len(result["rows"]):
              raise SystemExit("Game-grading output count does not match its rows")
          print(f"Validated {result['graded_games']} completed frozen game records.")
          for market in ("winner", "ats", "ou"):
              print(f"{market}: {result['summary'][market]}")
          PY
      - name: Commit refreshed History results
        if: steps.window.outputs.run == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-official-results.json
          if ! git diff --cached --quiet; then
            git commit -m "data: grade completed frozen game predictions"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Game results are unchanged; nothing to publish."
          fi
