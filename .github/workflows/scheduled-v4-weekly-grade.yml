name: Scheduled V4 Weekly Research Grading
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 3'
permissions:
  contents: write
concurrency:
  group: v4-weekly-results
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/challenger-metrics-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backtest.txt
      - run: python -m research.v4_weekly_grade
      - name: Save research grading results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v4-weekly-results/
          if ! git diff --cached --quiet; then
            git commit -m "Update V4 weekly grading against actual NFL results"
            git pull --rebase origin research/challenger-metrics-2026
            git push origin HEAD:research/challenger-metrics-2026
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-weekly-actual-results
          path: research/v4-weekly-results/
          if-no-files-found: warn
