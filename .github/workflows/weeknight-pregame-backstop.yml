name: Monday and Thursday pregame capture backstop
on:
  schedule:
    # UTC windows cover Monday/Thursday evening in both CST and CDT.
    - cron: '3,13,23,33,43,53 23 * * 1,4'
    - cron: '3,13,23,33,43,53 0-3 * * 2,5'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/weeknight-pregame-backstop.yml'
      - 'scripts/weeknight_capture_backstop.js'
      - 'tests/test_weeknight_capture_backstop.js'
permissions:
  contents: read
  actions: write
concurrency:
  group: weeknight-pregame-backstop
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate safe dispatch policy
        run: node tests/test_weeknight_capture_backstop.js
      - name: Recover missing pregame capture
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {decide} = require(process.env.GITHUB_WORKSPACE + '/scripts/weeknight_capture_backstop.js');
            const read = name => JSON.parse(fs.readFileSync('data/' + name + '.json', 'utf8'));
            const games = read('live-v2').games || [];
            const state = read('dk-slate-refreshes');
            const locks = read('game-official-pregame-locks').records || [];
            const {owner, repo} = context.repo;
            const workflow_id = 'capture-game-pregame.yml';
            const response = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id, branch:'main', per_page:100});
            const result = decide(Date.now(), games, state, locks, response.data.workflow_runs);
            core.info(result.action + ': ' + result.reason + (result.game_id ? ' (' + result.game_id + ')' : ''));
            if (result.action === 'dispatch') {
              await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id, ref:'main'});
              core.warning('Dispatched the existing pregame capture for ' + result.game_id);
            }
