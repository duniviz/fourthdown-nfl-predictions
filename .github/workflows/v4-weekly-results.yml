name: Weekly V4 Model Versus Actual Results
on:
  workflow_dispatch:
  push:
    branches:
      - research/challenger-metrics-2026
    paths:
      - 'research/v4_weekly_grade.py'
      - '.github/workflows/v4-weekly-results.yml'
permissions:
  contents: write
concurrency:
  group: v4-weekly-results
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/challenger-metrics-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backtest.txt
      - name: Grade 2026 completed games by week and market
        run: python -m research.v4_weekly_grade
      - name: Save weekly comparison on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v4-weekly-results/
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly V4 research versus actual results"
            git pull --rebase origin research/challenger-metrics-2026
            git push origin HEAD:research/challenger-metrics-2026
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-weekly-model-versus-actual
          path: research/v4-weekly-results/
          if-no-files-found: warn
