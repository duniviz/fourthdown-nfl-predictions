name: Refresh DraftKings NFL lines twice daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12,22 * * *'
permissions:
  contents: write
concurrency:
  group: draftkings-odds-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pull DraftKings spreads totals and player props
        env:
          PARLAYAPI_KEY: ${{ secrets.PARLAYAPI_KEY }}
        run: python scripts/refresh_dk_lines.py
      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dk-game-odds.json data/dk-odds.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh DraftKings NFL game and player lines"
            git push
          fi
