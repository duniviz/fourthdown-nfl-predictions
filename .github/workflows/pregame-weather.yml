name: Refresh weather before kickoff
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pregame-weather
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check for games about an hour away
        id: kickoff
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          now = dt.datetime.now(dt.timezone.utc)
          games = json.loads(Path("data/live-v2.json").read_text())["games"]
          due = []
          for game in games:
              try:
                  kickoff = dt.datetime.fromisoformat(game["kickoff_utc"].replace("Z", "+00:00"))
                  minutes = (kickoff - now).total_seconds() / 60
              except (KeyError, TypeError, ValueError):
                  continue
              if 45 <= minutes <= 70:
                  due.append(game["game_id"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("run=" + str(bool(due)).lower(), file=output)
          print("Games approaching kickoff:", ", ".join(due) or "none")
          PY
      - name: Fetch game-time forecasts
        if: steps.kickoff.outputs.run == 'true'
        run: python -m live.weather
      - name: Publish weather
        if: steps.kickoff.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh pregame weather [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
