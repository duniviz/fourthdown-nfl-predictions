name: Weekly free NFL feature research
on:
  workflow_dispatch:
  schedule:
    - cron: '25 14 * * 3'
permissions:
  contents: write
concurrency:
  group: free-nfl-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backtest.txt
      - name: Collect free NFL pace, efficiency and opportunity research
        run: python -m live.free_feature_research
      - name: Publish research features (no production weight changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f data/free-feature-research.json ]]; then
            git add -f data/free-feature-research.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh free NFL research features [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
