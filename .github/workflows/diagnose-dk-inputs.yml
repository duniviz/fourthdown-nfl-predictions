name: Diagnose DK odds and snapshot inputs
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/diagnose-dk-inputs.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate available JSON feeds without exposing credentials
        run: |
          python - <<'PY'
          import json, pathlib
          for name in ('dk-odds.json','dk-line-history.json','dk-pregame-lines.json','count-projections.json','simulations.json'):
              path=pathlib.Path('data')/name
              if not path.exists():
                  print(f'{name}: MISSING');continue
              try:
                  data=json.loads(path.read_text())
              except Exception as exc:
                  print(f'{name}: INVALID JSON ({type(exc).__name__})');continue
              print(f'{name}: root type={type(data).__name__}')
              if isinstance(data,dict):
                  print(f'  fields: {list(data)[:25]}')
                  for key in ('rows','players','games'):
                      if isinstance(data.get(key),list):
                          rows=data[key]
                          print(f'  {key}: {len(rows)} records')
                          if rows and isinstance(rows[0],dict):
                              print(f'  {key} fields: {list(rows[0])[:35]}')
          PY
