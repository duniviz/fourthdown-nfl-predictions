name: Test weekly ML card selection
on:
  pull_request:
    paths:
      - 'tools/ml_card_rotation.py'
      - 'scripts/freeze_player_ml_predictions.py'
      - 'assets/fd-ml-rotation.js'
      - 'tests/test_ml_card_rotation.*'
      - '.github/workflows/test-ml-card-rotation.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml_card_rotation.py'
      - 'scripts/freeze_player_ml_predictions.py'
      - 'assets/fd-ml-rotation.js'
      - 'tests/test_ml_card_rotation.*'
      - '.github/workflows/test-ml-card-rotation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-backtest.txt
      - run: python -m unittest discover -s tests -p 'test_ml_card_rotation.py' -v
      - run: node tests/test_ml_card_rotation.js
      - name: Build candidates from the current research slate
        timeout-minutes: 5
        run: python -m tools.ml_card_rotation
