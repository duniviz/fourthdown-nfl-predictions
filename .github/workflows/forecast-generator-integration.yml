name: Weekly forecast generator integration check
on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * 2,4,6'
    - cron: '20 14 * * 0'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect production generator integration
        run: python tools/check_production_generator.py
      - name: Verify published data without changing it
        run: python tools/validate_prediction_refresh.py
