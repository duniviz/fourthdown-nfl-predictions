name: Test weekly learning safety
on:
  pull_request:
    paths:
      - 'live/weekly_learning.py'
      - 'tests/test_weekly_learning.py'
      - '.github/workflows/test-weekly-learning.yml'
  push:
    branches: [main]
    paths:
      - 'live/weekly_learning.py'
      - 'tests/test_weekly_learning.py'
      - '.github/workflows/test-weekly-learning.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_weekly_learning.py' -v
