name: Sunday preset game-day refresh
on:
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: 'Automated missed-run recovery (safety-gated before kickoff)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: sunday-preset-pregame-refresh
  cancel-in-progress: false
jobs:
  check-window:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm this is the Central Time schedule
        id: guard
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          RECOVERY_MODE: ${{ inputs.recovery_mode }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          if os.environ.get("GITHUB_EVENT_NAME") != "schedule":
              if os.environ.get("RECOVERY_MODE", "").lower() == "true":
                  central = ZoneInfo("America/Chicago")
                  now = dt.datetime.now(central)
                  games = json.loads(Path("data/live-v2.json").read_text()).get("games", [])
                  future = []
                  for game in games:
                      try:
                          kickoff = dt.datetime.fromisoformat(game["kickoff_utc"].replace("Z", "+00:00")).astimezone(central)
                      except (KeyError, TypeError, ValueError, AttributeError):
                          continue
                      if kickoff.date() == now.date() and kickoff > now:
                          future.append(kickoff)
                  # Even a queued recovery must not begin its full pipeline close to kickoff.
                  valid = now.weekday() == 6 and future and min(
                      (kickoff-now).total_seconds() for kickoff in future) >= 20*60
                  print("Recovery kickoff safety gate:", "passed" if valid else "blocked")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write(f"run={'true' if valid else 'false'}\n")
                  raise SystemExit(0)
              print("run=true")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("run=true\n")
              raise SystemExit(0)

          central = ZoneInfo("America/Chicago")
          now = dt.datetime.now(central)
          if now.weekday() != 6:
              valid = False
              reason = "Not Sunday in Central Time"
          else:
              games = json.loads(Path("data/live-v2.json").read_text()).get("games", [])
              game_today = False
              for game in games:
                  try:
                      kickoff = dt.datetime.fromisoformat(game["kickoff_utc"].replace("Z", "+00:00"))
                  except (KeyError, TypeError, ValueError):
                      continue
                  if kickoff.astimezone(central).date() == now.date():
                      game_today = True
                      break
              if not game_today:
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write("run=false\n")
                  print("No NFL game scheduled today")
                  raise SystemExit(0)
              schedule = os.environ["SCHEDULE_EXPR"]
              valid = schedule in {"0 8 * * 0", "0 11 * * 0", "30 14 * * 0", "45 18 * * 0"}
              reason = "Central Time preset matched" if valid else "Unrecognized Sunday schedule"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run={'true' if valid else 'false'}\n")
          print(reason)
          PY
  refresh-lines:
    needs: check-window
    if: needs.check-window.outputs.run == 'true'
    uses: ./.github/workflows/daily-dk-player-props.yml
    secrets: inherit
  refresh-forecasts:
    needs: refresh-lines
    if: needs.check-window.outputs.run == 'true'
    uses: ./.github/workflows/publish-v2.yml
    secrets: inherit
