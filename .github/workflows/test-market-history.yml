name: Test matchup market history
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/fd-market-history.js'
      - 'assets/fd-insights.css'
      - 'tests/test_market_history*.js'
      - '.github/workflows/test-market-history.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: |
          node tests/test_market_history.js
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/fd-market-history-server.log 2>&1 &
          node tests/test_market_history_browser.js
