name: Research correlated game simulation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/correlated_game_sim.py'
      - 'tests/test_correlated_game_sim.py'
      - '.github/workflows/research-game-sim.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_correlated_game_sim.py' -v
