name: Blowout historical data validation
on:
  push:
    branches: [research/blowout-validation]
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow requests
      - name: Verify pipeline syntax
        run: python -m py_compile research/build_blowout_tendencies.py
      - name: Download and aggregate historical NFL game scripts
        run: python research/build_blowout_tendencies.py --seasons 2023 2024 2025
      - name: Validate output and sample sizes
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          root=Path('reports/blowout_game_script')
          team=pd.read_csv(root/'team_score_script_by_quarter.csv')
          league=pd.read_csv(root/'league_score_script_by_quarter.csv')
          assert len(team)>100 and len(league)>10
          assert team.pass_rate.between(0,1).all()
          assert team.rush_rate.between(0,1).all()
          print('Team rows:',len(team),'League rows:',len(league))
          print(league.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blowout-historical-tendencies
          path: reports/blowout_game_script/*.csv
          if-no-files-found: warn
