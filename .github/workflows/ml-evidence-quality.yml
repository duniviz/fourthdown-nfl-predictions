name: FOURTHDOWN ML evidence quality gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_ml_evidence.py'
      - 'tests/test_audit_ml_evidence.py'
      - '.github/workflows/ml-evidence-quality.yml'
      - '.github/workflows/fourthdown-unified-weekly-ml.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed evidence logic
        run: python -m unittest discover -s tests -p 'test_audit_ml_evidence.py' -v
      - name: Inspect last committed frozen weekly evidence
        run: python -m scripts.audit_ml_evidence
