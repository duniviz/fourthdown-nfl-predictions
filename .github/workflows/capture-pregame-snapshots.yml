name: Capture last pregame projections and DK lines
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capture-pregame-snapshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check final pregame window
        id: kickoff
        run: |
          if python scripts/check_pregame_kickoff_window.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture available pregame source records
        if: steps.kickoff.outputs.run == 'true'
        run: python scripts/capture_pregame_snapshots.py
      - name: Freeze ten research-only shadow models
        if: steps.kickoff.outputs.run == 'true'
        run: python scripts/freeze_weekly_shadow_models.py
      - name: Freeze yardage and game research models
        if: steps.kickoff.outputs.run == 'true'
        run: python scripts/freeze_yardage_game_shadow_models.py
      - name: Commit snapshot updates
        if: steps.kickoff.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pregame-snapshots.json data/weekly-shadow-forecasts.json data/yardage-game-shadow-forecasts.json
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve latest pre-kickoff projections and DK lines"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
