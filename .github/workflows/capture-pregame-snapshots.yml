name: Capture last pregame projections and DK lines
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Serialize snapshot writes with line refreshes and forecast publishing.
  group: pregame-pipeline
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check final pregame window
        id: kickoff
        run: |
          if python scripts/check_pregame_kickoff_window.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install fitted ML inference dependencies
        if: steps.kickoff.outputs.run == 'true'
        run: python -m pip install numpy scikit-learn
      - name: Freeze research-only count challenger predictions
        if: steps.kickoff.outputs.run == 'true'
        run: python scripts/freeze_weekly_shadow_models.py
      - name: Train and freeze count-prop ML challengers
        if: steps.kickoff.outputs.run == 'true'
        run: python scripts/freeze_count_ml_predictions.py
      - name: Freeze yardage and game research models
        if: steps.kickoff.outputs.run == 'true'
        run: python scripts/freeze_yardage_game_shadow_models.py
      - name: Freeze trained ML player yardage predictions
        if: steps.kickoff.outputs.run == 'true'
        run: python scripts/freeze_player_ml_predictions.py
      - name: Train and freeze game spread and total ML challengers
        if: steps.kickoff.outputs.run == 'true'
        run: |
          if curl --fail --location --retry 2 --max-time 90 'https://github.com/nflverse/nfldata/raw/refs/heads/master/data/games.csv' -o /tmp/fourthdown-games.csv; then
            python scripts/freeze_game_ml_predictions.py /tmp/fourthdown-games.csv
          else
            echo 'WARNING: Historical game scores unavailable; no game ML forecasts generated' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify frozen live and challenger coverage
        if: steps.kickoff.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          snapshots=json.loads(Path("data/pregame-snapshots.json").read_text()).get("records",[])
          archive=Path("data/weekly-shadow-forecasts.json")
          rows=json.loads(archive.read_text()).get("rows",[]) if archive.exists() else []
          models=Counter(str(r.get("model")) for r in rows)
          games=len({str(r.get("game_id")) for r in snapshots})
          summary=(f"## Pregame freeze coverage\\n"
                   f"- Snapshot records: {len(snapshots)} across {games} games\\n"
                   f"- Frozen forecast rows: {len(rows)}\\n"
                   f"- Frozen live rows: {models.get('live',0)}\\n"
                   f"- Challenger models: {len([m for m in models if m != 'live'])}\\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:out.write(summary)
          print(summary)
          if not snapshots:
              raise SystemExit("No pregame snapshots saved in eligible kickoff window")
          if not rows or not models.get("live"):
              raise SystemExit("No paired comparison baseline frozen: investigate source identifiers and projection timestamps")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pregame-freeze-diagnostics
          path: |
            data/pregame-snapshots.json
            data/weekly-shadow-forecasts.json
          if-no-files-found: warn
      - name: Commit snapshot updates
        if: steps.kickoff.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/weekly-shadow-forecasts.json
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve latest pre-kickoff projections and DK lines"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
