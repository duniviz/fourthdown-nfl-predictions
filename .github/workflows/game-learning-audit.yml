name: Audit weekly game prediction learning
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/game_learning.py'
      - '.github/workflows/game-learning-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backtest.txt
      - name: Grade completed archived games and prior-week learning
        run: python -m research.game_learning
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-learning-audit
          path: research/game-learning/
          if-no-files-found: warn
