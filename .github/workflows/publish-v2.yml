name: Publish weekly v2 forecasts
'on':
  workflow_dispatch: {}
  push:
    paths:
      - '.github/forecast-refresh.txt'
      - 'data/verified-starters.json'
      - 'data/qb-replacement-trial.json'
  schedule:
    # Forecasts run after DK lines on Tuesday, Wednesday, and Saturday at about 5 PM Central.
    # The guard selects the correct UTC hour for daylight/standard time.
    - cron: '17 22,23 * * 2,3,6'
    # Game-day forecasts run 45–115 minutes before kickoff when the slate check is due.
    - cron: '7 * * 0,1,4,5,6'
    # Monday Night Football: one forecast check every half hour, gated to the kickoff window.
    - cron: '30 0,1,2 * * 2'
permissions:
  contents: write
concurrency:
  group: publish-v2
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Central Time refresh window
        id: schedule_guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "17 22,23 * * 2,3,6" ]]; then
            if [[ "$(TZ=America/Chicago date +%H)" != "17" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 0,1,2 * * 2" ]]; then
            if ! python scripts/check_mnf_forecast_window.py; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "7 * * 0,1,4,5,6" ]]; then
            if ! python -m scripts.check_pregame_forecast_window; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight compile-check all Python modules
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m compileall -q backtest live research scripts tests tools
      - name: Install nflverse data dependencies
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m pip install -r requirements-backtest.txt
      - name: Validate pipeline
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      # Grade the completed slate before building the next one, so player
      # research can consume the latest validated residual evidence.
      - name: Grade completed-game player projections
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_results
      - name: Grade immutable official game locks against final scores
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.game_official_results
      - name: Learn validated player correction weights for next forecast
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_weight_learning
      - name: Refresh NFL injury reports
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.injuries
      - name: Generate current-season v2 forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: FOURTHDOWN_SKIP_V2_ARCHIVE=1 python -m live.generate
      - name: Refresh QB, RB, WR, and TE depth-chart starters
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/refresh_starters.py
      # The first pass supplies this week's slate to the starter refresh. Re-run
      # after refresh so the final score and win share use the current QB feed.
      - name: Recalculate forecasts with refreshed QB starters
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.generate
      - name: Refresh free game previews from final forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: python tools/generate_free_game_previews.py
      - name: Learn from completed games and validate before applying corrections
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.weekly_learning
      - name: Generate player research baselines
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_research
      - name: Diagnose QB passing yard forecasts and saved snapshot
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/player-research.json').read_text())
          print('PLAYER_FORECAST_GENERATED_AT:',j.get('generated_at_utc'))
          print('PLAYER_FORECAST_WEEK:',j.get('week'))
          for p in j.get('players',[]):
              if p.get('stat_key')=='passing_yards' and any(n in str(p.get('player','')).lower() for n in ('mayfield','cousins')):
                  print('QB_FORECAST_DIAGNOSTIC:',json.dumps({k:p.get(k) for k in ('player','game_id','projection','expected_opportunities','last_5_opportunities_avg','last_5_avg','expected_yards_per_opportunity','role_share','availability_status','opponent_adjustment','game_script_adjustment')}))
          PY
      - name: Validate player projection units and plausible ranges
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.validate_props
      - name: Audit player projections and flag suspicious workloads
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.projection_audit
      - name: Simulate game scores and player yardage 10000 times
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.simulate
      - name: Verify player projections match simulation data
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.validate_published
      - name: Refresh stadium weather forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.weather
      - name: Generate research-only V3 feature shadow
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -m live.free_feature_research
          python tools/v3_score_shadow.py --v2 data/live-v2.json --features data/free-feature-research.json --output data/v3-score-shadow.json --history data/v3-score-shadow-history.json
      - name: Verify refreshed production timestamps before publishing
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          now=datetime.now(timezone.utc)
          sources=[
              ('forecast',Path('data/live-v2.json'),'generated_at_utc',timedelta(minutes=45)),
              ('DraftKings game odds',Path('data/dk-game-odds.json'),'snapshot_date_utc',timedelta(hours=26)),
          ]
          for label,path,key,limit in sources:
              data=json.loads(path.read_text())
              stamp=datetime.fromisoformat(data[key].replace('Z','+00:00'))
              age=now-stamp
              print(f'{label}: {stamp.isoformat()} UTC, age {age}')
              if age<timedelta(0):
                  raise SystemExit(f'REFRESH_FAILED: {label} timestamp is in the future')
              if age>limit:
                  if label == 'forecast':
                      raise SystemExit(f'REFRESH_FAILED: {label} timestamp is stale; refusing to publish')
                  print(f'::warning::DraftKings game odds were not refreshed; preserving previous verified quote timestamp ({age} old). Publishing new forecast separately.')
          PY
      - name: Publish forecast and player research JSON
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/verified-starters.json data/ai-game-previews.json data/live-v2.json data/v2-history.json data/player-research.json data/injuries.json data/weather.json data/simulations.json data/player-results.json data/player-calibration.json data/game-official-results.json data/game-learning-status.json data/player-weight-learning.json data/projection-audit.json data/free-feature-research.json data/v3-score-shadow.json data/v3-score-shadow-history.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update current-week v2 predictions [skip ci]"
            # Generated staging files are intentionally not published; clear them
            # before rebasing the committed production feeds onto the latest main.
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi

