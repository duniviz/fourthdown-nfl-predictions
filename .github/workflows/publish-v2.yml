name: Publish weekly v2 forecasts
'on':
  workflow_dispatch: {}
  push:
    paths:
      - '.github/forecast-refresh.txt'
  schedule:
    # Daily 7 PM Central: 00 UTC during CDT, 01 UTC during CST (following UTC day).
    # Guard checks America/Chicago to prevent duplicate daily runs.
    - cron: '17,43 0,1 * * *'
    # Preserve existing Sunday morning pregame refresh.
    - cron: '15 13 * * 0'
    # Preserve existing Thursday morning game-day refresh.
    - cron: '15 13 * * 4'
    # Monday Night Football: UTC Tuesday covers Monday evening Central.
    - cron: '0,30 0,1,2 * * 2'
    - cron: '7 * * * 0,1,2,4,5'
permissions:
  contents: write
concurrency:
  group: publish-v2
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Central Time refresh window
        id: schedule_guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "17,43 0,1 * * *" ]]; then
            if [[ "$(TZ=America/Chicago date +%H)" != "19" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0,30 0,1,2 * * 2" ]]; then
            if ! python scripts/check_mnf_forecast_window.py; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "7 * * * 0,1,2,4,5" ]]; then
            if ! python -m scripts.check_pregame_forecast_window; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight compile-check all Python modules
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m compileall -q backtest live research scripts tests tools
      - name: Install nflverse data dependencies
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m pip install -r requirements-backtest.txt
      - name: Validate pipeline
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      # Grade the completed slate before building the next one, so player
      # research can consume the latest validated residual evidence.
      - name: Grade completed-game player projections
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_results
      - name: Grade immutable official game locks against final scores
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.game_official_results
      - name: Learn validated player correction weights for next forecast
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_weight_learning
      - name: Refresh NFL injury reports
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.injuries
      - name: Generate current-season v2 forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.generate
      - name: Refresh free game previews from latest forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: python tools/generate_free_game_previews.py
      - name: Learn from completed games and validate before applying corrections
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.weekly_learning
      - name: Generate player research baselines
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_research
      - name: Diagnose QB passing yard forecasts and saved snapshot
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/player-research.json').read_text())
          print('PLAYER_FORECAST_GENERATED_AT:',j.get('generated_at_utc'))
          print('PLAYER_FORECAST_WEEK:',j.get('week'))
          for p in j.get('players',[]):
              if p.get('stat_key')=='passing_yards' and any(n in str(p.get('player','')).lower() for n in ('mayfield','cousins')):
                  print('QB_FORECAST_DIAGNOSTIC:',json.dumps({k:p.get(k) for k in ('player','game_id','projection','expected_opportunities','last_5_opportunities_avg','last_5_avg','expected_yards_per_opportunity','role_share','availability_status','opponent_adjustment','game_script_adjustment')}))
          PY
      - name: Validate player projection units and plausible ranges
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.validate_props
      - name: Audit player projections and flag suspicious workloads
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.projection_audit
      # The dedicated 7:05 PM odds workflow handles no-game evenings.
      # Avoid a second paid DK request during the nightly forecast publish.
      - name: Avoid duplicate no-game evening DK requests
        id: dk_dedup
        if: steps.schedule_guard.outputs.run == 'true'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "17,43 0,1 * * *" ]] && python scripts/check_pregame_kickoff_window.py --no-game-evening; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch DraftKings NFL props from ParlayAPI
        if: steps.schedule_guard.outputs.run == 'true' && steps.dk_dedup.outputs.skip != 'true'
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python -m live.dk_odds
      - name: Fill missing DraftKings markets from SportsGameOdds (free-tier guarded)
        if: steps.schedule_guard.outputs.run == 'true' && steps.dk_dedup.outputs.skip != 'true'
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python tools/refresh_sportsgameodds_backup.py
      - name: Archive DraftKings line movement
        if: steps.schedule_guard.outputs.run == 'true' && steps.dk_dedup.outputs.skip != 'true'
        run: python -m live.line_history
      - name: Lock latest pregame player cards with verified DraftKings lines
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.lock_pregame_props
      - name: Refresh verified DraftKings game spreads and totals
        if: steps.schedule_guard.outputs.run == 'true' && steps.dk_dedup.outputs.skip != 'true'
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python -m live.dk_game_refresh
      - name: Archive verified pregame game forecast and DK quote observations
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.game_pregame_observations
      - name: Freeze official 30-minute pregame game observations
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.game_official_pregame_locks
      - name: Simulate game scores and player yardage 10000 times
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.simulate
      - name: Verify player projections match simulation data
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.validate_published
      - name: Refresh stadium weather forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.weather
      - name: Generate research-only V3 feature shadow
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -m live.free_feature_research
          python tools/v3_score_shadow.py --v2 data/live-v2.json --features data/free-feature-research.json --output data/v3-score-shadow.json --history data/v3-score-shadow-history.json
      - name: Verify refreshed production timestamps before publishing
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          now=datetime.now(timezone.utc)
          sources=[
              ('forecast',Path('data/live-v2.json'),'generated_at_utc',timedelta(minutes=45)),
              ('DraftKings game odds',Path('data/dk-game-odds.json'),'snapshot_date_utc',timedelta(hours=26)),
          ]
          for label,path,key,limit in sources:
              data=json.loads(path.read_text())
              stamp=datetime.fromisoformat(data[key].replace('Z','+00:00'))
              age=now-stamp
              print(f'{label}: {stamp.isoformat()} UTC, age {age}')
              if age<timedelta(0):
                  raise SystemExit(f'REFRESH_FAILED: {label} timestamp is in the future')
              if age>limit:
                  if label == 'forecast':
                      raise SystemExit(f'REFRESH_FAILED: {label} timestamp is stale; refusing to publish')
                  print(f'::warning::DraftKings game odds were not refreshed; preserving previous verified quote timestamp ({age} old). Publishing new forecast separately.')
          PY
      - name: Publish forecast and player research JSON
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ai-game-previews.json data/live-v2.json data/v2-history.json data/player-research.json data/player-history.json data/injuries.json data/weather.json data/dk-odds.json data/simulations.json data/player-results.json data/player-calibration.json data/dk-line-history.json data/dk-game-odds.json data/dk-game-line-history.json data/sportsgameodds-usage.json data/game-pregame-observations.json data/game-official-pregame-locks.json data/game-official-results.json data/game-learning-status.json data/player-weight-learning.json data/projection-audit.json data/free-feature-research.json data/v3-score-shadow.json data/v3-score-shadow-history.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update current-week v2 predictions [skip ci]"
            # Generated staging files are intentionally not published; clear them
            # before rebasing the committed production feeds onto the latest main.
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi

