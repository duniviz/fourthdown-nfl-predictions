name: Publish weekly v2 forecasts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/forecast-refresh.txt'
  schedule:
    - cron: '15 13 * * 2,4,6,0'
permissions:
  contents: write
concurrency:
  group: publish-v2
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install nflverse data dependencies
        run: python -m pip install -r requirements-backtest.txt
      - name: Validate pipeline
        run: python -m unittest discover -s tests -p 'test_live.py' -v
      - name: Generate current-season v2 forecasts
        run: python -m live.generate
      - name: Generate player research baselines
        run: python -m live.player_research
      - name: Publish forecast and player research JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/live-v2.json data/v2-history.json data/player-research.json data/player-history.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update current-week v2 predictions [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
