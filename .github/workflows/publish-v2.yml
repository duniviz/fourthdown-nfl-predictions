name: Publish weekly v2 forecasts
'on':
  workflow_dispatch: {}
  workflow_call: {}
  workflow_run:
    workflows: [Daily DraftKings player prop refresh, FOURTHDOWN unified weekly ML cycle, Publish ESPN scoreboard backup]
    types: [completed]
  push:
    paths:
      - '.github/forecast-refresh.txt'
      - 'data/verified-starters.json'
      - 'data/qb-replacement-trial.json'
  schedule:
    # UTC crons. The timezone key is omitted because the Nov 25 Chicago-labeled
    # schedules fired as UTC. Comments are America/Chicago. Game-day ticks below
    # are T-115/T-100/T-85 (Sunday 3:25 PM uses T-83 to stay off minute 0), inside
    # the 80–150 minute pipeline window and no earlier than T-120, so a fast run
    # still stamps live-v2 inside the 2-hour freshness rule. Two entries per
    # window so one dropped registration still leaves a tick. CST months are
    # 1, 2, 11, 12 and CDT months are 9, 10.
    # Daily forecast at 5:17 PM CT. CST = 23:17 UTC. CDT = 22:17 UTC.
    - cron: '17 23 * * *'
    - cron: '17 22 * * *'
    # Twice-hourly net for a kickoff that is not listed. The guard still requires the 80–150 minute window.
    - cron: '7,37 * * * *'
    # Thursday 7:15 PM CT: 5:20/5:35/5:50 PM. CST = 23:20/23:35/23:50 UTC Thursday. CDT = 22:20/22:35/22:50 UTC Thursday.
    - cron: '20,35 23 * 1,2,11,12 4'
    - cron: '50 23 * 1,2,11,12 4'
    - cron: '20,35 22 * 9,10 4'
    - cron: '50 22 * 9,10 4'
    # Saturday/Sunday 8:30 AM CT: 6:35/6:50/7:05 AM. CST = 12:35/12:50 and 13:05 UTC. CDT = 11:35/11:50 and 12:05 UTC.
    - cron: '35,50 12 * 1,2,11,12 0,6'
    - cron: '5 13 * 1,2,11,12 0,6'
    - cron: '35,50 11 * 9,10 0,6'
    - cron: '5 12 * 9,10 0,6'
    # Sunday noon CT: 10:05/10:20/10:35 AM. CST = 16:05/16:20/16:35 UTC. CDT = 15:05/15:20/15:35 UTC.
    - cron: '5,20 16 * 1,2,11,12 0'
    - cron: '35 16 * 1,2,11,12 0'
    - cron: '5,20 15 * 9,10 0'
    - cron: '35 15 * 9,10 0'
    # Sunday 3:05 PM CT: 1:10/1:25/1:40 PM. CST = 19:10/19:25/19:40 UTC. CDT = 18:10/18:25/18:40 UTC.
    - cron: '10,25 19 * 1,2,11,12 0'
    - cron: '40 19 * 1,2,11,12 0'
    - cron: '10,25 18 * 9,10 0'
    - cron: '40 18 * 9,10 0'
    # Sunday 3:25 PM CT: 1:30/1:45/2:02 PM. CST = 19:30/19:45 and 20:02 UTC. CDT = 18:30/18:45 and 19:02 UTC.
    - cron: '30,45 19 * 1,2,11,12 0'
    - cron: '2 20 * 1,2,11,12 0'
    - cron: '30,45 18 * 9,10 0'
    - cron: '2 19 * 9,10 0'
    # Sunday 7:20 PM CT: 5:25/5:40/5:55 PM. CST = 23:25/23:40/23:55 UTC Sunday. CDT = 22:25/22:40/22:55 UTC Sunday.
    - cron: '25,40 23 * 1,2,11,12 0'
    - cron: '55 23 * 1,2,11,12 0'
    - cron: '25,40 22 * 9,10 0'
    - cron: '55 22 * 9,10 0'
    # Monday 7:15 PM CT: 5:20/5:35/5:50 PM. CST = 23:20/23:35/23:50 UTC Monday. CDT = 22:20/22:35/22:50 UTC Monday.
    - cron: '20,35 23 * 1,2,11,12 1'
    - cron: '50 23 * 1,2,11,12 1'
    - cron: '20,35 22 * 9,10 1'
    - cron: '50 22 * 9,10 1'
    # Thu Dec 24 7:15 PM CT (HOU@PHI) uses the Thursday CST ticks above.
    # Thu Nov 26 noon CT (CHI@DET): 10:05/10:20/10:35 AM = 16:05/16:20/16:35 UTC.
    - cron: '5,20 16 26 11 *'
    - cron: '35 16 26 11 *'
    # Thu Nov 26 3:30 PM CT (PHI@DAL): 1:35/1:50/2:05 PM = 19:35/19:50 and 20:05 UTC.
    - cron: '35,50 19 26 11 *'
    - cron: '5 20 26 11 *'
    # Thu Nov 26 7:20 PM CT (KC@BUF): 5:25/5:40/5:55 PM = 23:25/23:40/23:55 UTC.
    - cron: '25,40 23 26 11 *'
    - cron: '55 23 26 11 *'
    # Fri Nov 27 2:00 PM CT (DEN@PIT): 12:05/12:20/12:35 PM = 18:05/18:20/18:35 UTC.
    - cron: '5,20 18 27 11 *'
    - cron: '35 18 27 11 *'
    # Fri Dec 25 noon CT (GB@CHI): 10:05/10:20/10:35 AM = 16:05/16:20/16:35 UTC.
    - cron: '5,20 16 25 12 *'
    - cron: '35 16 25 12 *'
    # Fri Dec 25 3:30 PM CT (BUF@DEN): 1:35/1:50/2:05 PM = 19:35/19:50 and 20:05 UTC.
    - cron: '35,50 19 25 12 *'
    - cron: '5 20 25 12 *'
    # Fri Dec 25 7:15 PM CT (LAR@SEA): 5:20/5:35/5:50 PM = 23:20/23:35/23:50 UTC.
    - cron: '20,35 23 25 12 *'
    - cron: '50 23 25 12 *'
    # Sat Dec 26 3:30 PM CT flex: 1:35/1:50/2:05 PM = 19:35/19:50 and 20:05 UTC.
    - cron: '35,50 19 26 12 *'
    - cron: '5 20 26 12 *'
    # Sat Dec 26 7:00 PM CT flex: 5:05/5:20/5:35 PM = 23:05/23:20/23:35 UTC.
    - cron: '5,20 23 26 12 *'
    - cron: '35 23 26 12 *'
    # Sat Dec 19 4:00 PM CT (SEA@PHI): 2:05/2:20/2:35 PM = 20:05/20:20/20:35 UTC.
    - cron: '5,20 20 19 12 *'
    - cron: '35 20 19 12 *'
    # Sat Dec 19 7:20 PM CT (CHI@BUF): 5:25/5:40/5:55 PM = 23:25/23:40/23:55 UTC.
    - cron: '25,40 23 19 12 *'
    - cron: '55 23 19 12 *'
permissions:
  contents: write
concurrency:
  # Serialize line refresh, forecasts, and final pregame locks.
  group: pregame-pipeline
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Central Time refresh window
        id: schedule_guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping forecast because the preceding refresh or ML cycle did not succeed"
              exit 0
            fi
            # An independently refreshed scoreboard can wake the pipeline if
            # a future kickoff changed; do not wait for the old kickoff window.
            if [[ "${{ github.event.workflow_run.name }}" == "Publish ESPN scoreboard backup" ]]; then
              if python -m live.schedule_flex_check; then
                echo "run=true" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            # The Tuesday ML cycle must finish before forecasting so its learned outputs are included.
            if [[ "${{ github.event.workflow_run.name }}" == "FOURTHDOWN unified weekly ML cycle" ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Running the new-week forecast after Tuesday ML evaluation completed successfully"
              exit 0
            fi
            # Sunday preset runs always refresh after DK; other days keep the kickoff-window guard.
            if [[ "$(TZ=America/Chicago date +%u)" == "7" ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! python -m scripts.check_pregame_forecast_window; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "${{ github.event_name }}" == "schedule" && ( "${{ github.event.schedule }}" == "17 22 * * *" || "${{ github.event.schedule }}" == "17 23 * * *" ) ]]; then
            if [[ "$(TZ=America/Chicago date +%H)" != "17" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Run on game dates too when the nearest kickoff still leaves a safe build buffer.
            if ! python -m scripts.daily_forecast_refresh_window; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Every other UTC schedule is a pre-kick tick or the twice-hourly net.
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" != "17 22 * * *" && "${{ github.event.schedule }}" != "17 23 * * *" && "${{ github.event.schedule }}" != "30 0,1,2 * * 2" ]]; then
            if ! python -m scripts.check_pregame_forecast_window && ! python -m scripts.stale_forecast_recovery; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 0,1,2 * * 2" ]]; then
            if ! python scripts/check_mnf_forecast_window.py; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight compile-check all Python modules
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m compileall -q backtest live research scripts tests tools
      - name: Install nflverse data dependencies
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m pip install -r requirements-backtest.txt
      - name: Validate pipeline
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      # Grade the completed slate before building the next one, so player
      # research can consume the latest validated residual evidence.
      - name: Grade completed-game player projections
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_results
      - name: Grade immutable official game locks against final scores
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.game_official_results
      - name: Learn validated player correction weights for next forecast
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_weight_learning
      - name: Refresh NFL injury reports
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.injuries
      - name: Generate current-season v2 forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: FOURTHDOWN_SKIP_V2_ARCHIVE=1 python -m live.generate
      - name: Refresh QB, RB, WR, and TE depth-chart starters
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/refresh_starters.py
      # The first pass supplies this week's slate to the starter refresh. Re-run
      # after refresh so the final score and win share use the current QB feed.
      - name: Recalculate forecasts with refreshed QB starters
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.generate
      - name: Refresh free game previews from final forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: python tools/generate_free_game_previews.py
      - name: Learn from completed games and validate before applying corrections
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.weekly_learning
      - name: Generate player research baselines
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_research
      - name: Build same-refresh research ML card candidates
        if: steps.schedule_guard.outputs.run == 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: python -m tools.ml_card_rotation
      - name: Diagnose QB passing yard forecasts and saved snapshot
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/player-research.json').read_text())
          print('PLAYER_FORECAST_GENERATED_AT:',j.get('generated_at_utc'))
          print('PLAYER_FORECAST_WEEK:',j.get('week'))
          for p in j.get('players',[]):
              if p.get('stat_key')=='passing_yards' and any(n in str(p.get('player','')).lower() for n in ('mayfield','cousins')):
                  print('QB_FORECAST_DIAGNOSTIC:',json.dumps({k:p.get(k) for k in ('player','game_id','projection','expected_opportunities','last_5_opportunities_avg','last_5_avg','expected_yards_per_opportunity','role_share','availability_status','opponent_adjustment','game_script_adjustment')}))
          PY
      - name: Validate player projection units and plausible ranges
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.validate_props
      - name: Audit player projections and flag suspicious workloads
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.projection_audit
      - name: Simulate game scores and player yardage 10000 times
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.simulate
      - name: Verify player projections match simulation data
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.validate_published
      - name: Refresh stadium weather forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.weather
      - name: Generate research-only V3 feature shadow
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -m live.free_feature_research
          python tools/v3_score_shadow.py --v2 data/live-v2.json --features data/free-feature-research.json --output data/v3-score-shadow.json --history data/v3-score-shadow-history.json
      - name: Verify refreshed production timestamps before publishing
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          now=datetime.now(timezone.utc)
          sources=[
              ('forecast',Path('data/live-v2.json'),'generated_at_utc',timedelta(minutes=45)),
              ('DraftKings game odds',Path('data/dk-game-odds.json'),'snapshot_date_utc',timedelta(hours=26)),
          ]
          for label,path,key,limit in sources:
              data=json.loads(path.read_text())
              stamp=datetime.fromisoformat(data[key].replace('Z','+00:00'))
              age=now-stamp
              print(f'{label}: {stamp.isoformat()} UTC, age {age}')
              if age<timedelta(0):
                  raise SystemExit(f'REFRESH_FAILED: {label} timestamp is in the future')
              if age>limit:
                  if label == 'forecast':
                      raise SystemExit(f'REFRESH_FAILED: {label} timestamp is stale; refusing to publish')
                  print(f'::warning::DraftKings game odds were not refreshed; preserving previous verified quote timestamp ({age} old). Publishing new forecast separately.')
          PY
      - name: Publish forecast and player research JSON
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/verified-starters.json data/ai-game-previews.json data/live-v2.json data/v2-history.json data/player-research.json data/injuries.json data/weather.json data/simulations.json data/player-results.json data/player-calibration.json data/game-official-results.json data/game-learning-status.json data/player-weight-learning.json data/projection-audit.json data/free-feature-research.json data/v3-score-shadow.json data/v3-score-shadow-history.json data/weather-history.json
          for file in data/ml-card-rotation.json data/ml-card-batches.json data/ml-card-batch-history.json; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update current-week v2 predictions [skip ci]"
            # Generated staging files are intentionally not published; clear them
            # before rebasing the committed production feeds onto the latest main.
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi

