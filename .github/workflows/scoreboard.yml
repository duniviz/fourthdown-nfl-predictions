name: Update NFL scoreboard
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scoreboard
  cancel-in-progress: false
jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch NFL scoreboard snapshot
        run: python -m live.scores
      - name: Publish score data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/live-scores.json
          git commit -m "Update NFL scoreboard [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
