name: Freeze independent pregame game ML challengers
'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [.github/workflows/freeze-game-ml-challengers.yml]
  workflow_run:
    workflows: [Publish weekly v2 forecasts, Publish count prop projections]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: game-ml-freeze
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check independent early ML window (T-90 to T-45)
        id: guard
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "workflow_run" && "${{ github.event.workflow_run.conclusion }}" == "success" ]] || python -m research.game_ml_freeze_guard; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install historical model dependencies
        if: steps.guard.outputs.due == 'true'
        run: python -m pip install -r requirements-backtest.txt
      - name: Freeze research-only game ML challengers
        if: steps.guard.outputs.due == 'true'
        run: python -m research.freeze_pregame_game_challengers
      - name: Freeze player and scoring research challengers
        if: steps.guard.outputs.due == 'true'
        run: |
          python scripts/freeze_weekly_shadow_models.py
          python scripts/freeze_count_ml_predictions.py
          python scripts/freeze_yardage_game_shadow_models.py
          python scripts/freeze_player_ml_predictions.py
      - name: Commit only frozen ML predictions
        if: steps.guard.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/weekly-shadow-forecasts.json
          if ! git diff --cached --quiet; then
            git commit -m "Freeze independent pregame game ML challengers [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
