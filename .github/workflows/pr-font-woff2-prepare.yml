name: PR-only WOFF2 font conversion
on:
  push:
    branches:
      - 'polish/betting-board-mobile-20261116'
    paths:
      - '.github/workflows/pr-font-woff2-prepare.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/betting-board-mobile-20261116
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local font conversion dependencies
        run: pip install 'fonttools[woff]>=4.55,<5'
      - name: Convert already self-hosted TTF fonts to WOFF2
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          for source in sorted(Path("assets/fonts").glob("*.ttf")):
              font = TTFont(str(source))
              font.flavor = "woff2"
              output = source.with_suffix(".woff2")
              font.save(str(output))
              print(output, output.stat().st_size)
          PY
      - name: Commit converted fonts to this PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/*.woff2
          if ! git diff --cached --quiet; then
            git commit -m "Add WOFF2 versions of existing self-hosted fonts [skip ci]"
            git push origin HEAD:polish/betting-board-mobile-20261116
          fi
