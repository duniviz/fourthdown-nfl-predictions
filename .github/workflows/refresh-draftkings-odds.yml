name: Refresh DraftKings NFL odds
on:
  workflow_dispatch:
  schedule:
    # Poll hourly; local Central-time gate runs the 4-hour baseline plus pre-kickoff slate checks.
    - cron: '0 * * * *'
permissions:
  contents: write
concurrency:
  group: draftkings-odds-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Central time schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=America/Chicago date +%H)
          DAY=$(TZ=America/Chicago date +%u)  # Monday=1 ... Sunday=7
          # Standard kickoffs (Central): Sun 12:00, 3:05/3:25, 7:20;
          # Thu/Mon 7:15. Refresh ~1 hour before each slate. Saturday
          # special slates use the same early/late/night windows.
          PRE_KICKOFF=false
          if [[ "$DAY" == "7" || "$DAY" == "6" ]]; then
            if [[ "$HOUR" == "11" || "$HOUR" == "14" || "$HOUR" == "18" ]]; then PRE_KICKOFF=true; fi
          elif [[ "$DAY" == "1" || "$DAY" == "4" ]]; then
            if [[ "$HOUR" == "18" ]]; then PRE_KICKOFF=true; fi
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$HOUR" == "00" || "$HOUR" == "04" || "$HOUR" == "08" || "$HOUR" == "12" || "$HOUR" == "16" || "$HOUR" == "20" || "$PRE_KICKOFF" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch DraftKings markets from ParlayAPI
        if: steps.clock.outputs.run == 'true'
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python tools/refresh_parlayapi_odds.py
      - name: Audit published data feeds
        if: steps.clock.outputs.run == 'true'
        run: python tools/audit_published_data.py
      - name: Commit refreshed snapshot
        if: steps.clock.outputs.run == 'true'
        run: |
          if [[ -n "$(git status --porcelain -- data/dk-game-odds.json data/dk-odds.json data/dk-opening-odds.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dk-game-odds.json data/dk-odds.json data/dk-opening-odds.json
            git commit -m "data: refresh DraftKings NFL odds"
            git push
          fi
