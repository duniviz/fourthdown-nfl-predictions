name: Backtest Confidence Pool

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/backtest_confidence_pool.py
      - backtest/**
      - live/simulate.py
      - .github/workflows/backtest-confidence-pool.yml

permissions:
  contents: read

jobs:
  replay-2025:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install replay dependencies
        run: pip install nflreadpy
      - name: Replay 2025 confidence pool
        run: python tools/backtest_confidence_pool.py --season 2025 --output research/confidence-pool-2025/results.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: confidence-pool-2025-backtest
          path: research/confidence-pool-2025/results.json
