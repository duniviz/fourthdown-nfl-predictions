name: Automated pipeline failure alerts
on:
  workflow_run:
    workflows:
      - Collect historical NFL training data
      - Tuesday weather model review
      - Accuracy Engine weekly research
      - Verify pregame capture integrity
      - Capture pregame projections and DraftKings lines
      - Freeze independent pregame game ML challengers
      - FOURTHDOWN unified weekly ML cycle
      - Capture last pregame projections and DK lines
      - Test pregame capture
      - Archive pregame DK player props
      - Publish count prop projections
      - Scheduled V4 Weekly Research Grading
      - Site integrity checks
      - Generate unique pregame editorials
      - Publish Model Lab research results
      - Publish weekly v2 forecasts
    types: [completed]
permissions:
  actions: write
  issues: write
jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update one actionable failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            // A transient nflverse/GitHub 403 is recoverable. Retry just the
            // failed count-prop job once; preserve the exact original run
            // and alert only after recovery also fails.
            if (run.name === 'Publish count prop projections' &&
                run.head_branch === 'main' && Number(run.run_attempt || 1) === 1) {
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({
                  ...context.repo, run_id: run.id
                });
                core.warning('Automatic one-time count-prop retry dispatched: ' + run.html_url);
                return;
              } catch (err) {
                core.warning('Automatic count-prop retry failed: ' + err.message);
                // Fall through to the actionable issue instead of hiding failure.
              }
            }
            const title = '[Automation] ' + run.name + ' failed';
            const body = [
              'FOURTHDOWN pipeline needs attention.',
              '',
              '- Workflow: ' + run.name,
              '- Conclusion: ' + run.conclusion,
              '- Branch: ' + run.head_branch,
              '- Commit: ' + run.head_sha,
              '- Run: ' + run.html_url,
              '- Attempt: ' + (run.run_attempt || 1),
              '- Count-prop recovery: one failed-job retry is automatic; further errors need review.',
              '',
              'Live model promotions remain disabled unless independently validated.',
              'Review logs, correct the error, then rerun the workflow.'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }
