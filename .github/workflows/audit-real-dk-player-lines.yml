name: Audit real DK player line backtest coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/audit_historical_dk_player_lines.py'
      - '.github/workflows/audit-real-dk-player-lines.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m tools.audit_historical_dk_player_lines --output research/real-dk-player-line-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-dk-player-line-coverage
          path: research/real-dk-player-line-coverage.json
