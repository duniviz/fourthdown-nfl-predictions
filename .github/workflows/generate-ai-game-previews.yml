name: Generate unique pregame editorials
on:
  workflow_dispatch:
  schedule:
    # Tuesday 8:30 AM Central after the 7 AM forecast, then 1:30–5:30 PM.
    # Both UTC ranges are covered; the local-time guard chooses the right hour.
    - cron: '30 13,14,19,20,21,22,23 * * 2'
    # Recheck verified material changes every two hours on other days.
    - cron: '17 */2 * * 0,1,3,4,5,6'
permissions:
  contents: write
concurrency:
  group: unique-game-previews
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Tuesday Central editorial window
        id: editorial_window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 13,14,19,20,21,22,23 * * 2" ]]; then
            if ! [[ "$(TZ=America/Chicago date +%H)" =~ ^(8|13|14|15|16|17)$ ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Validate editorial pipeline offline
        if: steps.editorial_window.outputs.run == 'true'
        run: |
          python -m py_compile tools/generate_ai_game_previews.py
          python -m unittest discover -s tests -p 'test_ai_game_previews.py'
      - name: Generate evidence-based previews before lock
        if: steps.editorial_window.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOURTHDOWN_PREVIEW_MODEL: gpt-4.1-mini
        run: python tools/generate_ai_game_previews.py
      - name: Commit published previews
        if: steps.editorial_window.outputs.run == 'true'
        run: |
          if [ ! -f data/ai-game-previews.json ]; then
            echo "No preview file produced"
            exit 0
          fi
          git add data/ai-game-previews.json
          if git diff --cached --quiet; then
            echo "No new editorial previews"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-game-previews.json
          git commit -m "Update game-specific pregame editorial previews"
          git pull --rebase origin main
          git push

