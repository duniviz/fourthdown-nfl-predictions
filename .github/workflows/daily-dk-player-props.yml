name: Daily DraftKings player prop refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-dk-player-props.yml'
      - 'live/dk_game_refresh.py'
      - 'data/live-v2.json'
  schedule:
    # The later ticks retry a missed or failed non-game-day refresh. A daily
    # completion marker prevents extra feed calls after a successful run.
    - cron: '40 16 * * *'
      timezone: America/Chicago
    - cron: '10,40 17 * * *'
      timezone: America/Chicago
    # Preserve hourly player-line refreshes for non-Sunday game days; Sunday uses the preset pipeline below.
    - cron: '37 * * * 1,4,5,6'
      timezone: America/Chicago
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
concurrency:
  # Serialize with the pregame writer because both update the DK quote files.
  group: pregame-pipeline
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scheduled refresh window
        id: schedule_guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" != "37 * * * 1,4,5,6" ]]; then
            echo "daily=true" >> "$GITHUB_OUTPUT"
            echo "date=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"
            # The daily non-game refresh must not create a fifth Sunday game-day run.
            if ! python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          central=ZoneInfo("America/Chicago")
          today=dt.datetime.now(central).date()
          games=json.loads(Path("data/live-v2.json").read_text()).get("games", [])
          if not games:
              raise SystemExit("No slate available to verify a non-game day")
          for game in games:
              try:
                  kickoff=dt.datetime.fromisoformat(game["kickoff_utc"].replace("Z","+00:00"))
              except (KeyError,TypeError,ValueError):
                  continue
              if kickoff.astimezone(central).date()==today:
                  raise SystemExit("NFL game scheduled today; Sunday preset pipeline handles game-day refreshes")
          PY
            then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping daily refresh on a game day or when the slate cannot be verified"
              exit 0
            fi
          fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "37 * * * 1,4,5,6" ]]; then
            if ! python -m scripts.check_pregame_forecast_window; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Check for a completed daily refresh
        id: daily_completion
        if: steps.schedule_guard.outputs.daily == 'true' && steps.schedule_guard.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .daily-dk-complete
          key: daily-dk-complete-${{ steps.schedule_guard.outputs.date }}
      - name: Refresh upcoming DK game spreads, totals, and moneylines
        id: game_refresh
        if: steps.schedule_guard.outputs.run == 'true' && steps.daily_completion.outputs.cache-hit != 'true' && github.event.schedule != '37 * * * 1,4,5,6'
        continue-on-error: true
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python -m live.dk_game_refresh
      - name: Refresh DK player props from primary feed
        if: steps.schedule_guard.outputs.run == 'true' && steps.daily_completion.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python -m tools.refresh_parlayapi_odds --props-only
      - name: Fill missing or stale DK props from backup feed
        if: steps.schedule_guard.outputs.run == 'true' && steps.daily_completion.outputs.cache-hit != 'true'
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python -m tools.refresh_sportsgameodds_backup
      - name: Publish refreshed DK player quotes and game lines
        if: steps.schedule_guard.outputs.run == 'true' && steps.daily_completion.outputs.cache-hit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dk-odds.json data/dk-opening-odds.json data/dk-game-odds.json data/dk-game-line-history.json
          if [ -f data/sportsgameodds-usage.json ]; then
            git add -f data/sportsgameodds-usage.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh daily DraftKings player and game lines"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new verified DK quotes; saved lines remain intact."
          fi
      - name: Mark daily refresh complete
        if: steps.schedule_guard.outputs.daily == 'true' && steps.schedule_guard.outputs.run == 'true' && steps.daily_completion.outputs.cache-hit != 'true' && steps.game_refresh.outcome == 'success'
        run: echo "${{ steps.schedule_guard.outputs.date }}" > .daily-dk-complete
      - name: Save daily completion marker
        if: steps.schedule_guard.outputs.daily == 'true' && steps.schedule_guard.outputs.run == 'true' && steps.daily_completion.outputs.cache-hit != 'true' && steps.game_refresh.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .daily-dk-complete
          key: daily-dk-complete-${{ steps.schedule_guard.outputs.date }}

