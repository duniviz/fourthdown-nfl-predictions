name: Capture official pregame DraftKings game lines
'on':
  workflow_dispatch: {}
  schedule:
    # GitHub Actions UTC schedule; actual kickoff times are UTC-aware.
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: publish-v2
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check kickoff capture window
        id: guard
        shell: bash
        run: |
          if python -m live.pregame_capture_guard; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch verified DraftKings spreads and totals
        if: steps.guard.outputs.run == 'true'
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python -m live.dk_game_refresh
      - name: Save pregame forecast and DK observations
        if: steps.guard.outputs.run == 'true'
        run: python -m live.game_pregame_observations
      - name: Freeze official 15-minute testing lines and projections
        if: steps.guard.outputs.run == 'true'
        run: python -m live.game_official_pregame_locks
      - name: Commit captured data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dk-game-odds.json data/dk-game-line-history.json data/game-pregame-observations.json data/game-official-pregame-locks.json
          if ! git diff --cached --quiet; then
            git commit -m "Capture pregame DraftKings game snapshot [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify official lock after kickoff
        if: steps.guard.outputs.run == 'true'
        run: python -m live.verify_game_pregame_locks
