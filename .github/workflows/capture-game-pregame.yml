name: Capture pregame projections and DraftKings lines
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-game-pregame.yml']
  workflow_run:
    workflows: [Publish weekly v2 forecasts, Publish count prop projections]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: pregame-pipeline
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate projection history safeguards
        run: python -m unittest discover -s tests -p 'test_projection_change_tracker.py' -v
      - name: Save and refresh pregame snapshots
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python -m live.pregame_cycle
