name: Capture pregame projections and DraftKings lines
on:
  workflow_dispatch:
    inputs:
      wait_for_window:
        description: Wait until the T-45 capture window instead of checking once
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/capture-game-pregame.yml']
  workflow_run:
    workflows: [Publish weekly v2 forecasts, Publish count prop projections]
    types: [completed]
  schedule:
    # Off minute 0 and off the five-minute herd. One delivered run waits until T-42
    # or re-dispatches itself, so the capture still starts inside T-45 to T-30.
    - cron: '8,38 * * * *'
permissions:
  contents: write
  actions: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: pregame-capture-arm
      cancel-in-progress: false
    outputs:
      due: ${{ steps.guard.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check kickoff window outside the shared writer queue
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ARM_WAIT: ${{ github.event.inputs.wait_for_window }}
        run: |
          python -m scripts.pregame_window_wait --role capture
          if [[ "$(grep -E '^due=' "$GITHUB_OUTPUT" | tail -n 1)" == "due=true" ]]; then
            echo "### Pregame refresh starting" >> "$GITHUB_STEP_SUMMARY"
            echo "This run will refresh DraftKings lines and save them with the current projection." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No pregame refresh due" >> "$GITHUB_STEP_SUMMARY"
            echo "No upcoming game is in its T-45 capture window yet. This check made no data changes." >> "$GITHUB_STEP_SUMMARY"
          fi
  capture:
    needs: preflight
    if: needs.preflight.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pregame-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate projection history safeguards
        run: python -m unittest discover -s tests -p 'test_projection_change_tracker.py' -v
      - name: Save and refresh pregame snapshots
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python -m live.pregame_cycle
      - name: Arm the next capture window
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: schedule
        run: python -m scripts.pregame_window_wait --role capture --follow-up

# Re-check pregame locks after the verified 2026-11-22 kickoff correction.
