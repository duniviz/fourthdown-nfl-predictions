name: Joint player prop probability backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/backtest_joint_player_props.py'
      - '.github/workflows/joint-player-prop-backtest.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backtest.txt
      - name: Backtest independent versus correlated joint player probabilities
        run: python -m tools.backtest_joint_player_props --start 2016 --end 2026 --output research/joint-player-props.json
      - uses: actions/upload-artifact@v4
        with:
          name: joint-player-prop-research
          path: research/joint-player-props.json
