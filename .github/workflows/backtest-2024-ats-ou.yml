name: Backtest 2024 ATS and O/U

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research/nfl_2024_backtest_ready.csv
      - tools/backtest_ats_ou.py
      - backtest/**
      - .github/workflows/backtest-2024-ats-ou.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install nflreadpy
      - name: Run score-verified replay
        run: python tools/backtest_ats_ou.py --season 2024 --csv research/nfl_2024_backtest_ready.csv --output research/ats-ou-2024/results.json
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-ou-2024-backtest
          path: research/ats-ou-2024/results.json
