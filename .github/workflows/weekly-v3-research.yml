name: Weekly V3 research learning and readiness
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Weekly player ML challenger audit"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  research:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v3-challenger
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical data dependencies
        run: python -m pip install -r requirements-backtest.txt
      - name: Check out current production archive
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-archive
      - name: Use current production archive for weekly learner comparison
        run: |
          cp production-archive/data/player-results.json data/player-results.json
          python - <<'PY'
          import json
          rows=json.load(open('data/player-results.json')).get('rows',[])
          if not rows: raise SystemExit('No production results available for learner audit')
          print(f'Using {len(rows)} production archive rows')
          PY
      - name: Audit weekly player learning
        run: python -m research.weekly_learning
      - name: Audit weekly game learning
        run: python -m research.game_learning
      - name: Run 2024-2025 V3 challenger holdout
        run: python -m research.v3_challenger
      - name: Backtest position-specific defensive matchups
        run: python -m research.position_matchup
      - name: Check out readiness gate from main
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: readiness-gate
      - name: Evaluate guarded auto-promotion readiness
        if: always()
        run: python readiness-gate/research/auto_promotion_gate.py
      - name: Ensure same-slate output directory is clean
        if: always()
        run: |
          mkdir -p research/same-slate
          rm -f research/same-slate/verified-input.json research/same-slate/pregame-forecasts.json research/same-slate/leaderboard.json research/same-slate/LEADERBOARD.md
      - name: Join frozen pregame projections to verified final results
        if: always()
        run: |
          python readiness-gate/research/join_frozen_pregame_results.py \
            --snapshots readiness-gate/data/pregame-snapshots.json \
            --results readiness-gate/data/player-results.json \
            --output research/same-slate/verified-input.json || echo "Waiting for final stats that match frozen pregame snapshots." >> "$GITHUB_STEP_SUMMARY"
      - name: Build chronological same-slate challengers
        if: always()
        run: |
          if [ -f research/same-slate/verified-input.json ]; then
            python readiness-gate/research/build_same_slate_challengers.py \
              --input research/same-slate/verified-input.json \
              --output research/same-slate/pregame-forecasts.json
          fi
      - name: Run same-slate challenger leaderboard when pregame archive exists
        if: always()
        run: |
          if [ -f research/same-slate/pregame-forecasts.json ]; then
            python readiness-gate/research/same_slate_leaderboard.py \
              --input research/same-slate/pregame-forecasts.json \
              --output research/same-slate
            cat research/same-slate/LEADERBOARD.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "STATUS: WAITING_FOR_MATCHED_FINALS — same-slate comparison was not generated. Historical tests may still pass." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Grade automatically frozen weekly shadow models
        if: always()
        run: |
          if [ -f readiness-gate/data/weekly-shadow-forecasts.json ]; then
            python readiness-gate/research/grade_weekly_shadow_models.py
            cat readiness-gate/research/weekly-shadow-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "STATUS: WAITING_FOR_PREGAME_CAPTURE — no frozen shadow forecasts yet. This run does not verify weekly same-slate comparisons." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Grade yardage and game models on the same slate
        if: always()
        run: |
          if [ -f readiness-gate/data/weekly-shadow-forecasts.json ]; then
            python readiness-gate/research/grade_yardage_game_models.py
            cat readiness-gate/research/yardage-game-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Yardage/game comparison pending frozen pregame forecasts." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Grade game winner, ATS and over/under picks on paired frozen predictions
        if: always()
        run: |
          if [ -f readiness-gate/data/weekly-shadow-forecasts.json ]; then
            python readiness-gate/research/grade_paired_game_models.py
            cat readiness-gate/research/paired-game-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pick grading pending frozen pregame game forecasts." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Show weekly learner summary
        if: always()
        run: |
          if [ -f research/weekly-learning/RESULTS.md ]; then
            cat research/weekly-learning/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive model readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourtdown-weekly-model-readiness
          path: |
            research/weekly-learning/
            research/game-learning/
            research/v3-results/
            research/position-matchup/
            research/auto-promotion/
            research/same-slate/
            readiness-gate/research/weekly-shadow-results/
            readiness-gate/research/yardage-game-results/
            readiness-gate/research/paired-game-results/
          if-no-files-found: warn
