name: Weekly V3 research learning and readiness
on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 3'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v3-challenger
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical data dependencies
        run: python -m pip install -r requirements-backtest.txt
      - name: Check out current production archive
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-snapshot
      - name: Use the same archived production forecasts for weekly learner comparison
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          source = pathlib.Path('production-snapshot/data/player-results.json')
          data = json.loads(source.read_text())
          rows = data.get('rows', [])
          if not rows:
              raise SystemExit('No production player results available for same-slate evaluation')
          target = pathlib.Path('data/player-results.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, target)
          print(f'Using {len(rows)} production-archive rows for baseline vs weekly bias learner')
          PY
      - name: Audit weekly player learning
        run: python -m research.weekly_learning
      - name: Audit weekly game learning
        run: python -m research.game_learning
      - name: Run 2024-2025 V3 challenger holdout
        run: python -m research.v3_challenger
      - name: Backtest position-specific defensive matchups
        run: python -m research.position_matchup
      - name: Check out readiness gate from main
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: readiness-gate
      - name: Evaluate guarded auto-promotion readiness
        if: always()
        run: python readiness-gate/research/auto_promotion_gate.py
      - name: Publish same-slate learner summary
        if: always()
        run: |
          if [ -f research/weekly-learning/RESULTS.md ]; then
            cat research/weekly-learning/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive model readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourtdown-weekly-model-readiness
          path: |
            research/weekly-learning/
            research/game-learning/
            research/v3-results/
            research/position-matchup/
            research/auto-promotion/
          if-no-files-found: warn
