name: Tuesday pre-forecast evaluation
on:
  workflow_dispatch:
  schedule:
    # 8:30 AM Central; both UTC hours cover CST and CDT.
    - cron: '30 13,14 * * 2'
permissions:
  contents: write
concurrency:
  group: tuesday-preforecast-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Tuesday Central Time schedule
        id: schedule_guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(TZ=America/Chicago date +%H:%M)" != "08:30" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.schedule_guard.outputs.run == 'true'
        with:
          python-version: '3.11'
      - name: Install forecast dependencies
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m pip install -r requirements-backtest.txt
      - name: Grade the completed slate
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_results
      - name: Learn from validated pregame player forecasts
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m live.player_weight_learning
      - name: Publish pre-forecast evaluation evidence
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/player-results.json data/player-calibration.json data/player-weight-learning.json
          if ! git diff --cached --quiet; then
            git commit -m "data: evaluate completed slate before weekly forecasts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

