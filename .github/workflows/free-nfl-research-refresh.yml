name: Free NFL research forecast refresh
on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to research
        required: false
        type: string
      week:
        description: Target week (strict pre-week cutoff)
        required: false
        type: string
  schedule:
    - cron: '35 13 * * 2,4,6'
    - cron: '35 14 * * 0'
permissions:
  contents: write
concurrency:
  group: research-forecast-refresh
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public NFL snapshots and compute research-only forecasts
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging
          curl --fail --location --retry 3 --max-time 90 --silent --show-error \
            https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv \
            -o staging/games.csv
          python -m pip install --disable-pip-version-check polars
          python tools/download_current_player_stats.py --season "${INPUT_SEASON:-2026}" \
            --output staging/player_stats.csv
          TARGET=$(python -c 'import sys; from pathlib import Path; sys.path.insert(0,"tools"); from run_research_refresh import season_week; a,b=season_week(Path("staging/games.csv"),__import__("os").environ.get("INPUT_SEASON",""),__import__("os").environ.get("INPUT_WEEK","")); print(f"{a} {b}")')
          read -r TARGET_SEASON TARGET_WEEK <<< "$TARGET"
          if curl --fail --location --retry 2 --max-time 60 --silent --show-error \
            "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_${TARGET_SEASON}.csv" \
            -o staging/injuries.csv; then
            python -c 'import csv; f=open("staging/injuries.csv",encoding="utf-8-sig"); print("INJURY SOURCE HEADERS:",csv.DictReader(f).fieldnames)'
            if ! python tools/normalize_nflverse_injuries.py --input staging/injuries.csv \
              --season "${TARGET_SEASON}" --week "${TARGET_WEEK}" \
              --output staging/injury-status.csv; then
              rm -f staging/injury-status.csv
              echo "WARNING: Injury schema incompatible; availability remains unverified"
            fi
          else
            echo "Injury source unavailable; all players remain unverified"
          fi
          python tools/run_research_refresh.py --schedule-csv staging/games.csv \
            --weekly-csv staging/player_stats.csv --season "${INPUT_SEASON:-}" \
            --week "${INPUT_WEEK:-}" --injury-csv staging/injury-status.csv --output-dir staging/results
      - name: Monitor configured official NFL inactive report pages (research only)
        if: success()
        continue-on-error: true
        run: |
          python tools/fetch_official_inactive_sources.py \
            --urls-json data/official-inactive-report-urls.json \
            --output staging/results/official-inactive-source-evidence.json
      - name: Fetch supplemental Sleeper injury flags (research only)
        if: success()
        continue-on-error: true
        run: |
          python tools/research_sleeper_injuries.py \
            --players-json staging/results/player-projections.json \
            --output staging/results/sleeper-injury-flags.json
      - name: Compare research player yards to existing DraftKings odds snapshot
        if: success()
        run: |
          if [ -f data/dk-odds.json ] && [ -f staging/results/player-projections.json ]; then
            python tools/match_dk_player_lines.py --players-json staging/results/player-projections.json \
              --odds-json data/dk-odds.json --output staging/results/dk-player-comparisons.json
          else
            echo "DraftKings odds or player projections unavailable; no comparisons fabricated"
          fi
      - name: Evaluate prop research ranking prerequisites
        if: success()
        run: |
          if [ -f staging/results/dk-player-comparisons.json ]; then
            python tools/rank_prop_research.py \
              --comparisons-json staging/results/dk-player-comparisons.json \
              --output staging/results/prop-ranking-diagnostics.json
          fi
      - name: Publish clearly labeled research comparisons (current scheduled week only)
        if: success() && github.ref == 'refs/heads/main' && inputs.season == '' && inputs.week == ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path("staging/results/dk-player-comparisons.json")
          if not source.exists():
              raise SystemExit("No DK comparison report; skipping publication")
          data=json.loads(source.read_text())
          if not data.get("comparisons") or not data.get("counts",{}).get("total"):
              raise SystemExit("No player comparisons; skipping publication")
          target=Path("data/research-dk-comparisons.json")
          target.write_text(json.dumps(data,indent=2)+"\\n")
          print("Published research-only comparison snapshot:",data["counts"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f staging/results/sleeper-injury-flags.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          source=Path("staging/results/sleeper-injury-flags.json")
          data=json.loads(source.read_text())
          if data.get("status")!="supplemental_research_only":
              raise SystemExit("Unexpected injury flag status")
          Path("data/research-injury-flags.json").write_text(json.dumps(data,indent=2)+"\\n")
          print("Published supplemental injury flags:",data.get("flagged_markets",0))
          PY
          fi
          git add data/research-dk-comparisons.json data/research-injury-flags.json 2>/dev/null || git add data/research-dk-comparisons.json
          if ! git diff --cached --quiet; then
            git commit -m "Update research-only DK player comparisons"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload research reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-research-forecast-${{ github.run_id }}
          path: staging/results/
          if-no-files-found: warn
          retention-days: 30
