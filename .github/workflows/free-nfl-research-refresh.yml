name: Free NFL research forecast refresh
on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to research
        required: false
        type: string
      week:
        description: Target week (strict pre-week cutoff)
        required: false
        type: string
  schedule:
    - cron: '35 13 * * 2,4,6'
    - cron: '35 14 * * 0'
permissions:
  contents: read
concurrency:
  group: research-forecast-refresh
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public NFL snapshots and compute research-only forecasts
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging
          curl --fail --location --retry 3 --max-time 90 --silent --show-error \
            https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv \
            -o staging/games.csv
          python -m pip install --disable-pip-version-check polars
          python tools/download_current_player_stats.py --season "${INPUT_SEASON:-2026}" \
            --output staging/player_stats.csv
          TARGET=$(python -c 'import sys; from pathlib import Path; sys.path.insert(0,"tools"); from run_research_refresh import season_week; a,b=season_week(Path("staging/games.csv"),__import__("os").environ.get("INPUT_SEASON",""),__import__("os").environ.get("INPUT_WEEK","")); print(f"{a} {b}")')
          read -r TARGET_SEASON TARGET_WEEK <<< "$TARGET"
          if curl --fail --location --retry 2 --max-time 60 --silent --show-error \
            "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_${TARGET_SEASON}.csv" \
            -o staging/injuries.csv; then
            python tools/normalize_nflverse_injuries.py --input staging/injuries.csv \
              --season "${TARGET_SEASON}" --week "${TARGET_WEEK}" \
              --output staging/injury-status.csv
          else
            echo "Injury source unavailable; all players remain unverified"
          fi
          python tools/run_research_refresh.py --schedule-csv staging/games.csv \
            --weekly-csv staging/player_stats.csv --season "${INPUT_SEASON:-}" \
            --week "${INPUT_WEEK:-}" --injury-csv staging/injury-status.csv --output-dir staging/results
      - name: Upload research reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-research-forecast-${{ github.run_id }}
          path: staging/results/
          if-no-files-found: warn
          retention-days: 30
