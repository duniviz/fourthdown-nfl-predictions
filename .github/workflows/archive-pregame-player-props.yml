name: Archive pregame DK player props
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: draftkings-odds-refresh
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual kickoff window
        id: kickoff
        run: |
          if python scripts/check_pregame_kickoff_window.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh DraftKings quotes directly from ParlayAPI
        if: steps.kickoff.outputs.run == 'true'
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python tools/refresh_parlayapi_odds.py
      - name: Test archive locking
        if: steps.kickoff.outputs.run == 'true'
        run: python -m unittest discover -s scripts -p "test_archive_pregame_player_lines.py" -v
      - name: Save verified pre-kickoff lines and projections
        if: steps.kickoff.outputs.run == 'true'
        run: python scripts/archive_pregame_player_lines.py
      - name: Commit refreshed odds and frozen player snapshots
        if: steps.kickoff.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dk-game-odds.json data/dk-odds.json data/dk-opening-odds.json data/dk-game-line-history.json data/player-history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh and lock pregame DraftKings lines"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
