name: Archive pregame DK player props
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * 0,1,4,5,6'
permissions:
  contents: write
concurrency:
  group: pregame-player-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save only timestamp-verified pre-kickoff lines and projections
        run: python scripts/archive_pregame_player_lines.py
      - name: Commit append-only archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: archive pregame DraftKings player props"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
