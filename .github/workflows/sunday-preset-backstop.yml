name: FOURTHDOWN Sunday preset missed-run backstop
on:
  schedule:
    # Staggered Central Time retries around each Sunday preset.
    - cron: '7,37 8,11,14,15,18,19 * * 0'
      timezone: America/Chicago
  workflow_dispatch:
  # Independent wake-up when GitHub skips the backstop cron itself.
  # This only runs the existing read-only decision policy, never a second writer.
  workflow_run:
    workflows: [Capture last pregame projections and DK lines, Capture pregame projections and DraftKings lines, FOURTHDOWN independent operations watchdog, FOURTHDOWN watchdog self-healing, FOURTHDOWN pregame feed freshness audit, Freeze independent pregame game ML challengers, Publish weekly v2 forecasts, Sunday preset game-day refresh]
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/sunday-preset-backstop.yml'
      - '.github/workflows/sunday-preset-game-day-refresh.yml'
      - 'scripts/sunday_preset_backstop_policy.js'
      - 'tests/test_sunday_preset_backstop.js'
      - 'tests/test_central_sunday_schedules.py'
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: fourthdown-sunday-preset-backstop
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Central Time Sunday schedules
        run: python -m unittest tests.test_central_sunday_schedules -v
      - name: Validate missing-run recovery guards
        run: node tests/test_sunday_preset_backstop.js
      - name: Recover a missed preset only while kickoff-safe
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const {decide} = require(process.env.GITHUB_WORKSPACE + '/scripts/sunday_preset_backstop_policy.js');
            const fs = require('fs');
            const games = JSON.parse(fs.readFileSync('data/live-v2.json', 'utf8')).games || [];
            const {owner,repo} = context.repo;
            const workflow_id = 'sunday-preset-game-day-refresh.yml';
            const response = await github.rest.actions.listWorkflowRuns({
              owner,repo,workflow_id,branch:'main',per_page:100
            });
            const result = decide(Date.now(),response.data.workflow_runs,games);
            core.info(result.action + ': ' + result.reason + (result.slot ? ' (' + result.slot + ')' : ''));
            if (result.action === 'dispatch') {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,repo,workflow_id,ref:'main',
                  inputs:{recovery_mode:'true'}
                });
                core.warning('Dispatched one missed Sunday preset after verifying kickoff safety');
              } catch (error) {
                await notify('Failed to dispatch the missed Sunday preset: ' + error.message);
                throw error;
              }
            } else if (result.action === 'alert') {
              await notify('Sunday preset recovery needs attention: ' + result.reason + '. No unsafe or duplicate retry attempted.');
            }
            async function notify(message) {
              const title='[Automation] Sunday pregame refresh missed';
              const marker='<!-- sunday-preset-missing:' + (result.slot || 'unknown') + ' -->';
              const body=message + '\n\nSlot: ' + (result.slot || 'unknown') +
                '\nRun: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId +
                '\nNo predictions or locks were changed by the monitor.\n' + marker;
              const issues=await github.paginate(github.rest.issues.listForRepo,{
                owner,repo,state:'open',per_page:100
              });
              const issue=issues.find(i=>!i.pull_request && i.title===title);
              if(!issue){ await github.rest.issues.create({owner,repo,title,body});return; }
              if((issue.body||'').includes(marker))return;
              const comments=await github.paginate(github.rest.issues.listComments,{
                owner,repo,issue_number:issue.number,per_page:100
              });
              if(!comments.some(c=>(c.body||'').includes(marker))){
                await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body});
              }
            }
