name: Refresh verified game context

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build schedule and availability context
        run: python tools/build_game_context.py
      - name: Commit refreshed context
        run: |
          if git diff --quiet -- data/game-context.json; then
            echo "No context changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-context.json
          git commit -m "Refresh verified game context"
          git push
