name: Test matching game slates
on:
  pull_request:
    paths:
      - 'index.html'
      - 'schedule-window.js'
      - 'tests/test_matching_slate.js'
      - '.github/workflows/test-matching-slate.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/fd-ui-server.log 2>&1 &
          node tests/test_matching_slate.js
