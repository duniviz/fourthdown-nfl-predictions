name: Test research odds matching
on:
  pull_request:
    paths:
      - 'tools/match_dk_player_lines.py'
      - 'live/dk_identity.py'
      - 'tests/test_dk_coverage_diagnostics.py'
      - '.github/workflows/test-research-odds-matching.yml'
  push:
    branches: [main]
    paths:
      - 'tools/match_dk_player_lines.py'
      - 'live/dk_identity.py'
      - 'tests/test_dk_coverage_diagnostics.py'
      - '.github/workflows/test-research-odds-matching.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_dk_coverage_diagnostics.py' -v
