name: Refresh nflverse defensive matchups
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10 * 9-12,1-2 *'
permissions:
  contents: write
concurrency:
  group: nflverse-defensive-matchups
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate verified position defensive contexts
        run: python scripts/build_nflverse_matchups.py
      - name: Commit data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nflverse-defensive-matchups.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified nflverse defensive matchups"
            git push
          fi
