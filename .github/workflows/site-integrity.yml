name: Site integrity checks
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'data/*.json'
      - 'scripts/verify_nflverse_matchup_coverage.py'
      - 'scripts/archive_pregame_player_lines.py'
      - 'scripts/test_archive_pregame_player_lines.py'
      - 'live/player_results.py'
      - 'tests/test_pregame_archive_grading.py'
      - 'tests/test_ml_promotion_safety.py'
      - 'tools/ml_auto_promotion.py'
      - 'tools/audit_player_result_grading.py'
      - 'tests/test_player_result_audit.py'
      - '.github/workflows/site-integrity.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'data/*.json'
      - 'scripts/verify_nflverse_matchup_coverage.py'
      - '.github/workflows/site-integrity.yml'
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in ./*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Validate published JSON feeds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          errors = []
          for path in Path("data").glob("*.json"):
              if path.stat().st_size == 0:
                  print(f"WARNING: empty optional feed: {path}")
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except (ValueError, UnicodeDecodeError) as exc:
                  errors.append(f"Invalid JSON: {path}: {exc}")
          if errors:
              raise SystemExit("\\n".join(errors))
          print("Published nonempty JSON feeds parse successfully")
          PY
      - name: Check pregame archive grading compatibility
        run: python -m unittest discover -s tests -p 'test_pregame_archive_grading.py' -v
      - name: Test actual pregame capture and kickoff lock
        run: python -m unittest discover -s scripts -p 'test_archive_pregame_player_lines.py' -v
      - name: Check fail-closed model promotion safety
        run: python -m unittest discover -s tests -p 'test_ml_promotion_safety.py' -v
      - name: Test player results grading audit
        run: python -m unittest discover -s tests -p 'test_player_result_audit.py' -v
      - name: Audit published player hit/miss results
        run: python tools/audit_player_result_grading.py
      - name: Verify production player feed and nflverse matchup coverage
        run: python scripts/verify_nflverse_matchup_coverage.py
      - name: Verify DraftKings game markets and quote history
        run: python tools/audit_dk_market_consistency.py
      - name: Verify score, player, count and simulation feed coherence
        run: python tools/audit_projection_coherence.py
      - name: Check required pages and assets
        run: |
          test -s index.html
          test -s bets.html
          test -s history.html
          test -s model-lab.html
          test -s accuracy-summary.js
          test -s opportunities.js
          test -s prop-desk.css
