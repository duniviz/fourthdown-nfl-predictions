name: V4 Frozen Challenger 2026 Validation
on:
  workflow_dispatch:
  push:
    branches:
      - research/challenger-metrics-2026
    paths:
      - 'research/v4_2026_validation.py'
      - '.github/workflows/v4-2026-validation.yml'
permissions:
  contents: write
concurrency:
  group: v4-2026-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/challenger-metrics-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backtest.txt
      - name: Test 2024-selected parameters against 2026 observations
        run: python -m research.v4_2026_validation
      - name: Publish validation report to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v4-2026-validation/results.json research/v4-2026-validation/RESULTS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record frozen V4 2026 validation results"
            git pull --rebase origin research/challenger-metrics-2026
            git push origin HEAD:research/challenger-metrics-2026
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-2026-frozen-validation
          path: research/v4-2026-validation/
          if-no-files-found: warn
