name: V4 Usage and Defense Feature Backtest
on:
  workflow_dispatch:
  push:
    branches:
      - research/challenger-metrics-2026
    paths:
      - 'research/v4_feature_screen.py'
      - '.github/workflows/v4-feature-screen.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/challenger-metrics-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backtest.txt
      - name: Run paired 2024 train and 2025 holdout
        run: python -m research.v4_feature_screen
      - name: Commit research result to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v4-feature-screening/results.json research/v4-feature-screening/RESULTS.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish V4 feature holdout test results"
            git pull --rebase origin research/challenger-metrics-2026
            git push origin HEAD:research/challenger-metrics-2026
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-usage-defense-holdout
          path: research/v4-feature-screening/
          if-no-files-found: warn
