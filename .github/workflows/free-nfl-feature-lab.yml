name: Free NFL feature research lab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/free-nfl-feature-lab.yml'
      - 'research/free_nfl_feature_lab.py'
      - 'tests/test_free_nfl_feature_lab.py'
      - 'tests/test_free_nfl_lab_workflow.py'
      - 'tools/refresh_weekly_player_ml_data.py'
  schedule:
    # Thursday: after Wednesday ML retraining, research only; no live writer.
    - cron: '30 15 * * 4'
permissions:
  contents: write
concurrency:
  group: fourthdown-free-nfl-feature-research
  cancel-in-progress: false
jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing open-data and machine learning dependencies
        run: python -m pip install -r requirements-backtest.txt
      - name: Test prior-week feature safeguards
        run: |
          python -m unittest discover -s tests -p test_free_nfl_feature_lab.py -v
          python -m unittest discover -s tests -p test_free_nfl_lab_workflow.py -v
      - name: Build completed-game historical baseline training rows
        if: github.event_name != 'pull_request'
        run: |
          python -m tools.refresh_weekly_player_ml_data --start 2023 --output data/weekly-player-ml-training.csv
          test -s data/weekly-player-ml-training.csv
      - name: Fetch free source archives and run research-only walk-forward ablations
        if: github.event_name != 'pull_request'
        run: |
          python -m research.free_nfl_feature_lab --start 2023 --input data/weekly-player-ml-training.csv --output data/research-free-nfl-features.json
      - name: Upload feature coverage and results
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: free-nfl-feature-research
          path: data/research-free-nfl-features.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish research results only, never live predictions
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/research-free-nfl-features.json')
          obj=json.loads(path.read_text())
          assert obj['research_only'] is True and obj['production_changed'] is False
          assert obj['automatic_promotion'] is False and isinstance(obj['markets'],dict)
          for market,v in obj['markets'].items():
              print(market, 'holdout rows:',v['holdout_rows'],
                    'source coverage:',v['source_coverage'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research-free-nfl-features.json
          if ! git diff --cached --quiet; then
            git commit -m "Research: weekly free NFL feature coverage and ML ablation [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
