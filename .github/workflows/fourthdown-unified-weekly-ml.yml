name: FOURTHDOWN unified weekly ML cycle
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Tuesday pre-forecast evaluation]
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/fourthdown-unified-weekly-ml.yml'
      - 'scripts/verify_weekly_learning_evidence.py'
      - 'tools/refresh_weekly_player_ml_data.py'
      - 'tools/ml_challengers.py'
      - 'live/backtest_players.py'
      - 'research/weather_player_backtest.py'
      - 'tests/test_weather_player_backtest.py'
      - 'tests/test_refresh_weekly_player_ml_data.py'
      - 'tests/test_ml_challengers.py'
      - 'tests/test_weekly_player_mix.py'
      - 'live/player_ml_runtime.py'
      - 'live/player_research.py'
      - 'live/player_results.py'
      - 'tools/train_deployable_player_ml.py'
      - 'tests/test_deployable_player_ml.py'
      - 'live/game_ml_runtime.py'
      - 'live/weekly_learning.py'
      - 'live/game_pregame_observations.py'
      - 'tools/train_deployable_game_ml.py'
      - 'tests/test_deployable_game_ml.py'
      - 'tests/test_weekly_learning_evidence.py'
      - 'scripts/audit_ml_evidence.py'
      - 'tests/test_audit_ml_evidence.py'
      - 'tests/test_ml_pipeline_integration.py'
      - 'research/grade_all_markets_paired.py'
      - 'tests/test_multiweek_paired_learning.py'
      - 'tests/test_pregame_workflow_schedule.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fourthdown-unified-weekly-ml.yml'
      - 'tools/train_deployable_player_ml.py'
permissions:
  contents: write
concurrency:
  group: game-ml-freeze
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-backtest.txt numpy scikit-learn nflreadpy polars pyarrow
      - name: Run weekly grading integration and evidence tests
        run: |
          python -m unittest discover -s tests -p 'test_ml_pipeline_integration.py' -v
          python -m unittest discover -s tests -p 'test_weekly_learning_evidence.py' -v
          python -m unittest discover -s tests -p 'test_official_game_lock_ml_bridge.py' -v
          python -m unittest discover -s tests -p 'test_multiweek_paired_learning.py' -v
          python -m unittest discover -s tests -p 'test_weekly_learning_evidence.py' -v

      - name: Test completed-game filtering and chronological splits
        run: |
          python -m unittest discover -s tests -p 'test_refresh_weekly_player_ml_data.py' -v
          python -m unittest discover -s tests -p 'test_ml_challengers.py' -v
          python -m unittest discover -s tests -p 'test_weekly_player_mix.py' -v
          python -m unittest discover -s tests -p 'test_deployable_player_ml.py' -v
          python -m unittest discover -s tests -p 'test_deployable_game_ml.py' -v
          python -m unittest discover -s tests -p 'test_weather_player_backtest.py' -v
          python -m research.weather_player_backtest --start 2016 --end 2025
      - name: Rebuild and evaluate full historical player data
        run: |
          python -m tools.refresh_weekly_player_ml_data --start 2016
          python -m tools.export_ml_card_history
          python -m tools.evaluate_ml_card_history
          python -m tools.ml_card_rotation
          python tools/ml_challengers.py --input data/weekly-player-ml-training.csv
          python -m tools.train_deployable_player_ml --input data/weekly-player-ml-training.csv
          python -m tools.train_deployable_game_ml
      - name: Exercise active game ML through scoring and pick invariants
        run: |
          python - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('data/game-ml-runtime.json'); j=json.loads(p.read_text())
          for decision in j['decisions'].values(): decision['active']=True
          p.write_text(json.dumps(j))
          p=Path('data/live-v2.json'); j=json.loads(p.read_text())
          for game in j['games']: game.pop('weekly_learning',None)
          p.write_text(json.dumps(j))
          PYTEST
          python -m live.weekly_learning
          python - <<'PYCHECK'
          import json, math
          games=json.load(open('data/live-v2.json'))['games']
          active=[g for g in games if any(x.get('active') for x in (g.get('game_ml_shadow') or {}).get('markets',{}).values())]
          print('Active game ML forecasts:',len(active))
          assert active, 'No active game ML forecasts reached the scoring pipeline'
          for g in active:
              assert g['projected_home_score']>=0 and g['projected_away_score']>=0
              assert abs(g['projected_margin_home']) <= g['projected_total']
              assert g['predicted_winner'] == (g['home'] if g['projected_margin_home']>0 else g['away'])
          PYCHECK
      - name: Exercise active player ML through publication validators
        run: |
          python - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('data/player-ml-runtime.json'); j=json.loads(p.read_text())
          for decision in j['decisions'].values(): decision['active']=True
          p.write_text(json.dumps(j))
          PYTEST
          python -m live.player_research
          python - <<'PYCHECK'
          import json
          from live.player_ml_runtime import forecast
          rows=json.load(open('data/player-research.json'))['players']
          runtime=json.load(open('data/player-ml-runtime.json'))
          slate=json.load(open('data/live-v2.json'))
          season, week=int(slate['season']), int(slate['week'])
          supported={'passing_yards','rushing_yards','receiving_yards'}
          active=[r for r in rows if (r.get('player_ml_shadow') or {}).get('active')]
          changed=[r for r in active if r['projection'] != r['player_ml_shadow']['baseline']]
          eligible=[r for r in rows if r.get('stat_key') in supported
                    and forecast(runtime,r['stat_key'],r['projection'],season,week) is not None]
          print(f'Eligible baseline rows: {len(eligible)}; active ML forecasts: {len(active)}; changed: {len(changed)}')
          if eligible:
              assert active, 'Eligible earlier-week ML forecasts did not reach publication'
              # Some valid candidates may equal the baseline after rounding/clamping.
              for r in active:
                  shadow=r['player_ml_shadow']
                  assert r['projection']==shadow['candidate'], 'Active ML candidate was not published'
                  assert (shadow['trained_season'],shadow['trained_week']) < (season,week), 'Same-week model leaked into publication'
          else:
              assert not active, 'Ineligible same-week/stale ML models must remain inactive'
              assert all(r.get('player_ml_shadow') is None for r in rows if r.get('stat_key') in supported), 'Rejected ML model emitted a shadow forecast'
              print('ML correctly failed closed: no eligible earlier-week inference models')
          PYCHECK
          python -m live.validate_props
          python -m live.simulate
          python -m live.validate_published

  weekly:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data and ML dependencies
        run: python -m pip install -r requirements-backtest.txt numpy scikit-learn nflreadpy polars pyarrow
      - name: Validate Python and safety tests
        run: |
          python -m compileall -q live tools research scripts
          python -m unittest discover -s tests -p 'test_paired_game_grading.py' -v
          python -m unittest discover -s tests -p 'test_count_ml_safety.py' -v
          python -m unittest discover -s tests -p 'test_expanded_game_feature_symmetry.py' -v
          python -m unittest discover -s tests -p 'test_official_game_lock_ml_bridge.py' -v
          python -m unittest discover -s tests -p 'test_ml_pipeline_integration.py' -v
          python -m unittest discover -s tests -p 'test_weekly_learning_evidence.py' -v
      - name: Verify archived pregame and completed-player data are present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("pregame-snapshots.json", "player-history.json"):
              path=Path("data")/name
              if not path.exists(): raise SystemExit(f"Missing required source: {path}")
              json.loads(path.read_text())
              print("Verified source:",path)
          path=Path("data/weekly-shadow-forecasts.json")
          if not path.exists():
              path.write_text(json.dumps({"schema_version":2,"description":"Empty pending first verified pregame freeze","rows":[]})+"\n")
              print("No prior frozen forecasts yet: initialized EMPTY research archive; no historical forecasts invented")
          else:
              json.loads(path.read_text())
              print("Verified existing frozen archive:",path)
          PY
      - name: Grade frozen player predictions against verified finals
        run: python -m live.player_results
      - name: Grade frozen game predictions against verified finals
        run: python -m live.game_official_results
      - name: Import verified official T-15 game incumbent locks
        run: python -m research.import_official_game_locks
      - name: Import archived production player projections
        run: python -m research.import_player_locks
      - name: Refresh completed-season and current-season player backtests
        run: python -m tools.refresh_weekly_player_ml_data --start 2016
      - name: Build validated full-history ML card training archive
        id: card_history
        continue-on-error: true
        run: python -m tools.export_ml_card_history
      - name: Compare expanded and recent player training history
        id: card_history_evaluation
        if: steps.card_history.outcome == 'success'
        continue-on-error: true
        run: python -m tools.evaluate_ml_card_history
      - name: Replay P3 position weather splits against 2016-2025 player forecasts
        run: python -m research.weather_player_backtest --start 2016 --end 2025
      - name: Retrain and evaluate historical player ML challengers
        run: python tools/ml_challengers.py --input data/weekly-player-ml-training.csv
      - name: Train deployable player ML and evaluate frozen paired forecasts
        run: python -m tools.train_deployable_player_ml --input data/weekly-player-ml-training.csv
      - name: Train deployable game ML and evaluate frozen paired forecasts
        run: python -m tools.train_deployable_game_ml
      - name: Grade frozen count and yardage player challengers
        run: python research/grade_weekly_shadow_models.py
      - name: Grade frozen yardage and game models
        run: python research/grade_yardage_game_models.py
      - name: Grade exact paired game challengers
        run: python research/grade_paired_game_models.py
      - name: Grade all available matched past weeks across markets
        run: python research/grade_all_markets_paired.py
      - name: Prove prior-week forecast evaluation sample
        run: python -m scripts.verify_weekly_learning_evidence
      - name: Check ML evidence audit guardrails
        run: |
          python -m unittest discover -s tests -p 'test_audit_ml_evidence.py' -v
          python -m scripts.audit_ml_evidence
      - name: Publish paired weekly leaderboards for Model Lab
        run: python scripts/publish_weekly_lab.py
      - name: Preserve research-only champion selection
        run: |
          python research/weekly_shadow_promotion.py
          python tools/ml_auto_promotion.py
      - name: Publish latest historical ML results to Model Lab
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('ml-challenger-review.json','ml-weekly-decisions.json'):
              path=Path('data')/name
              if not path.exists(): raise SystemExit(f'Missing ML report: {path}')
              json.loads(path.read_text())
              print('Validated',path)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/game-ml-runtime.json data/player-ml-runtime.json data/ml-challenger-review.json data/ml-weekly-decisions.json data/weekly-shadow-forecasts.json data/weekly-learning-evidence.json data/player-results.json data/player-calibration.json data/game-official-results.json data/model-lab-yardage-game.json data/model-lab-weekly-shadow.json
          if [[ "${{ steps.card_history.outcome }}" == "success" ]] && [ -s data/ml-card-training.csv.gz ] && [ -s data/ml-card-training-meta.json ]; then
            git add -f data/ml-card-training.csv.gz data/ml-card-training-meta.json
          else
            # An incomplete archive must neither replace the previous version
            # nor prevent the unrelated weekly results from rebasing.
            for file in data/ml-card-training.csv.gz data/ml-card-training-meta.json; do
              if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then git restore --worktree -- "$file"; else rm -f "$file"; fi
            done
          fi
          if [[ "${{ steps.card_history_evaluation.outcome }}" == "success" ]] && [ -s data/ml-card-history-evaluation.json ]; then
            git add -f data/ml-card-history-evaluation.json
          elif git ls-files --error-unmatch data/ml-card-history-evaluation.json >/dev/null 2>&1; then
            git restore --worktree -- data/ml-card-history-evaluation.json
          else
            rm -f data/ml-card-history-evaluation.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish weekly ML Lab research summary [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Summarize weekly cycle
        if: always()
        run: |
          echo '## FOURTHDOWN weekly ML research' >> "$GITHUB_STEP_SUMMARY"
          echo 'Player and game ML use pregame paired-evidence promotion and automatic rollback; other research challengers remain research-only.' >> "$GITHUB_STEP_SUMMARY"
          for f in research/weekly-shadow-results/RESULTS.md research/paired-game-results/RESULTS.md research/all-markets-paired-results/RESULTS.md research/weather-player-results/RESULTS.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fourthdown-unified-weekly-ml
          path: |
            research/feature-ablation-results/
            research/weekly-shadow-results/
            research/yardage-game-results/
            research/paired-game-results/
            research/all-markets-paired-results/
            research/weather-player-results/
            data/ml-challenger-review.json
            data/ml-weekly-decisions.json
            data/weekly-learning-evidence.json
          if-no-files-found: warn

  historical-2016-2026:
    # Keep the optional 2016-2026 sweep manual; the Tuesday weekly cycle
    # should focus on current paired grading and deployment evidence.
    if: github.event_name == 'workflow_dispatch'
    name: Extended history 2016-2026 (independent research)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical NFL research dependencies
        run: python -m pip install 'xgboost-cpu>=2.1,<4' numpy scikit-learn nflreadpy polars pyarrow
      - name: Validate historical ML experiment syntax
        run: python -m py_compile research/expanded_game_feature_lab.py
      - name: Train and compare 2016-2026 NFL historical windows
        timeout-minutes: 75
        run: python -u research/expanded_game_feature_lab.py
      - name: Summarize historical data coverage
        if: always()
        run: |
          if [ -f research/feature-ablation-results/report.json ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("research/feature-ablation-results/report.json").read_text())
          rows=r.get("results",[])
          seasons=sorted({x["holdout_season"] for x in rows})
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"## Extended historical NFL research\\nEvaluations: {len(rows)}; holdout seasons: {seasons}\\n")
          PY
          else
            echo 'No historical report generated; extended history research needs attention.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fourthdown-historical-2016-2026
          path: research/feature-ablation-results/
          if-no-files-found: warn
