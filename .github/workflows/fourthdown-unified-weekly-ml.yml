name: FOURTHDOWN unified weekly ML cycle
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fourthdown-unified-weekly-ml.yml'
      - 'scripts/verify_weekly_learning_evidence.py'
      - 'tools/refresh_weekly_player_ml_data.py'
      - 'tools/ml_challengers.py'
      - 'tests/test_refresh_weekly_player_ml_data.py'
      - 'tests/test_ml_challengers.py'
      - 'tests/test_weekly_learning_evidence.py'
      - 'tests/test_ml_pipeline_integration.py'
  push:
    branches: [main]
    paths: ['.github/workflows/fourthdown-unified-weekly-ml.yml']
  schedule:
    - cron: '45 16 * * 3'
permissions:
  contents: write
concurrency:
  group: game-ml-freeze
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-backtest.txt numpy scikit-learn
      - name: Run weekly grading integration and evidence tests
        run: |
          python -m unittest discover -s tests -p 'test_ml_pipeline_integration.py' -v
          python -m unittest discover -s tests -p 'test_weekly_learning_evidence.py' -v
          python -m unittest discover -s tests -p 'test_official_game_lock_ml_bridge.py' -v
          python -m unittest discover -s tests -p 'test_weekly_learning_evidence.py' -v

      - name: Test completed-game filtering and chronological splits
        run: |
          python -m unittest discover -s tests -p 'test_refresh_weekly_player_ml_data.py' -v
          python -m unittest discover -s tests -p 'test_ml_challengers.py' -v
      - name: Rebuild and evaluate full historical player data
        run: |
          python -m tools.refresh_weekly_player_ml_data --start 2016
          python tools/ml_challengers.py --input data/weekly-player-ml-training.csv

  weekly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data and ML dependencies
        run: python -m pip install -r requirements-backtest.txt numpy scikit-learn nflreadpy polars pyarrow
      - name: Validate Python and safety tests
        run: |
          python -m compileall -q live tools research scripts
          python -m unittest discover -s tests -p 'test_paired_game_grading.py' -v
          python -m unittest discover -s tests -p 'test_count_ml_safety.py' -v
          python -m unittest discover -s tests -p 'test_expanded_game_feature_symmetry.py' -v
          python -m unittest discover -s tests -p 'test_official_game_lock_ml_bridge.py' -v
          python -m unittest discover -s tests -p 'test_ml_pipeline_integration.py' -v
          python -m unittest discover -s tests -p 'test_weekly_learning_evidence.py' -v
      - name: Verify archived pregame and completed-player data are present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("pregame-snapshots.json", "player-history.json"):
              path=Path("data")/name
              if not path.exists(): raise SystemExit(f"Missing required source: {path}")
              json.loads(path.read_text())
              print("Verified source:",path)
          path=Path("data/weekly-shadow-forecasts.json")
          if not path.exists():
              path.write_text(json.dumps({"schema_version":2,"description":"Empty pending first verified pregame freeze","rows":[]})+"\n")
              print("No prior frozen forecasts yet: initialized EMPTY research archive; no historical forecasts invented")
          else:
              json.loads(path.read_text())
              print("Verified existing frozen archive:",path)
          PY
      - name: Grade frozen player predictions against verified finals
        run: python -m live.player_results
      - name: Grade frozen game predictions against verified finals
        run: python -m live.game_official_results
      - name: Import verified official T-15 game incumbent locks
        run: python -m research.import_official_game_locks
      - name: Import archived production player projections
        run: python -m research.import_player_locks
      - name: Refresh completed-season and current-season player backtests
        run: python -m tools.refresh_weekly_player_ml_data --start 2016
      - name: Retrain and evaluate historical player ML challengers
        run: python tools/ml_challengers.py --input data/weekly-player-ml-training.csv
      - name: Grade frozen count and yardage player challengers
        run: python research/grade_weekly_shadow_models.py
      - name: Grade frozen yardage and game models
        run: python research/grade_yardage_game_models.py
      - name: Grade exact paired game challengers
        run: python research/grade_paired_game_models.py
      - name: Grade all available matched past weeks across markets
        run: python research/grade_all_markets_paired.py
      - name: Prove prior-week forecast evaluation sample
        run: python -m scripts.verify_weekly_learning_evidence
      - name: Publish paired weekly leaderboards for Model Lab
        run: python scripts/publish_weekly_lab.py
      - name: Preserve research-only champion selection
        run: |
          python research/weekly_shadow_promotion.py
          python tools/ml_auto_promotion.py
      - name: Publish latest historical ML results to Model Lab
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('ml-challenger-review.json','ml-weekly-decisions.json'):
              path=Path('data')/name
              if not path.exists(): raise SystemExit(f'Missing ML report: {path}')
              json.loads(path.read_text())
              print('Validated',path)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ml-challenger-review.json data/ml-weekly-decisions.json data/weekly-shadow-forecasts.json data/weekly-learning-evidence.json data/player-results.json data/player-calibration.json data/game-official-results.json data/model-lab-yardage-game.json data/model-lab-weekly-shadow.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish weekly ML Lab research summary [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Summarize weekly cycle
        if: always()
        run: |
          echo '## FOURTHDOWN weekly ML research' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live model unchanged; promotion remains research-only until rollback and production replay are validated.' >> "$GITHUB_STEP_SUMMARY"
          for f in research/weekly-shadow-results/RESULTS.md research/paired-game-results/RESULTS.md research/all-markets-paired-results/RESULTS.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fourthdown-unified-weekly-ml
          path: |
            research/feature-ablation-results/
            research/weekly-shadow-results/
            research/yardage-game-results/
            research/paired-game-results/
            research/all-markets-paired-results/
            data/ml-challenger-review.json
            data/ml-weekly-decisions.json
            data/weekly-learning-evidence.json
          if-no-files-found: warn

  historical-2016-2026:
    name: Extended history 2016-2026 (independent research)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical NFL research dependencies
        run: python -m pip install numpy scikit-learn nflreadpy polars pyarrow
      - name: Validate historical ML experiment syntax
        run: python -m py_compile research/expanded_game_feature_lab.py
      - name: Train and compare 2016-2026 NFL historical windows
        timeout-minutes: 75
        run: python -u research/expanded_game_feature_lab.py
      - name: Summarize historical data coverage
        if: always()
        run: |
          if [ -f research/feature-ablation-results/report.json ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("research/feature-ablation-results/report.json").read_text())
          rows=r.get("results",[])
          seasons=sorted({x["holdout_season"] for x in rows})
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"## Extended historical NFL research\\nEvaluations: {len(rows)}; holdout seasons: {seasons}\\n")
          PY
          else
            echo 'No historical report generated; extended history research needs attention.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fourthdown-historical-2016-2026
          path: research/feature-ablation-results/
          if-no-files-found: warn
