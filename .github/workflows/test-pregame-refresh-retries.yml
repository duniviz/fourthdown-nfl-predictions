name: Test pregame refresh retries
on:
  pull_request:
    paths:
      - 'live/pregame_cycle.py'
      - 'live/pregame_refresh_state.py'
      - 'live/dk_game_refresh.py'
      - 'live/generate.py'
      - 'live/verified_scoreboard_kickoffs.py'
      - 'live/schedule_flex_check.py'
      - 'tests/test_schedule_flex_check.py'
      - 'tests/test_verified_scoreboard_kickoffs.py'
      - 'tests/test_dk_game_refresh.py'
      - 'tests/test_pregame_refresh_state.py'
      - 'scripts/check_pregame_forecast_window.py'
      - 'scripts/daily_forecast_refresh_window.py'
      - 'scripts/stale_forecast_recovery.py'
      - 'tests/test_stale_forecast_recovery.py'
      - 'tests/test_forecast_refresh_schedule.py'
      - 'tests/test_central_sunday_schedules.py'
      - '.github/workflows/publish-v2.yml'
      - '.github/workflows/test-pregame-refresh-retries.yml'
  push:
    branches: [main]
    paths:
      - 'live/pregame_cycle.py'
      - 'live/pregame_refresh_state.py'
      - 'live/dk_game_refresh.py'
      - 'live/generate.py'
      - 'live/verified_scoreboard_kickoffs.py'
      - 'live/schedule_flex_check.py'
      - 'tests/test_schedule_flex_check.py'
      - 'tests/test_verified_scoreboard_kickoffs.py'
      - 'tests/test_dk_game_refresh.py'
      - 'tests/test_pregame_refresh_state.py'
      - 'scripts/check_pregame_forecast_window.py'
      - 'scripts/daily_forecast_refresh_window.py'
      - 'scripts/stale_forecast_recovery.py'
      - 'tests/test_stale_forecast_recovery.py'
      - 'tests/test_forecast_refresh_schedule.py'
      - '.github/workflows/publish-v2.yml'
      - '.github/workflows/test-pregame-refresh-retries.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stale_forecast_recovery -v
      - run: python -m unittest tests.test_central_sunday_schedules tests.test_forecast_refresh_schedule tests.test_refresh_reliability tests.test_verified_scoreboard_kickoffs tests.test_schedule_flex_check tests.test_pregame_workflow_schedule -v
      - run: python -m unittest discover -s tests -p 'test_pregame_refresh_state.py' -v
      - run: python -m unittest discover -s tests -p 'test_pregame_capture_guard.py' -v
      - run: python -m unittest discover -s tests -p 'test_dk_game_refresh.py' -v
