name: Test projection change history
on:
  pull_request:
    paths:
      - 'tools/projection_change_tracker.py'
      - 'live/pregame_cycle.py'
      - 'assets/projection-changes.js'
      - 'tests/test_projection_change_tracker.py'
      - 'tests/test_projection_changes_display.js'
      - '.github/workflows/test-projection-changes.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m unittest discover -s tests -p 'test_projection_change_tracker.py' -v
      - run: node tests/test_projection_changes_display.js
