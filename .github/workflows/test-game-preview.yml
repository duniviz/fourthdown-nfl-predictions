name: Test game preview
on:
  pull_request:
    paths:
      - 'game-preview.html'
      - 'assets/fd-game-preview.js'
      - 'tests/test_game_preview.js'
      - 'tests/test_game_preview_browser.js'
      - '.github/workflows/test-game-preview.yml'
  push:
    branches: [main]
    paths:
      - 'game-preview.html'
      - 'assets/fd-game-preview.js'
      - 'tests/test_game_preview.js'
      - 'tests/test_game_preview_browser.js'
      - '.github/workflows/test-game-preview.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/test_game_preview.js
      - run: npm install --no-save playwright
      - run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/fd-preview.log 2>&1 &
          node tests/test_game_preview_browser.js
