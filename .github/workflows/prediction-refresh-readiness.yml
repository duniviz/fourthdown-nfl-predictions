name: Prediction refresh readiness and safety
on:
  workflow_dispatch:
  schedule:
    # Research readiness checks; these do not generate or publish forecasts.
    - cron: '15 13 * * 2,4,6'
    - cron: '15 14 * * 0'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing published projections
        run: python tools/validate_prediction_refresh.py
