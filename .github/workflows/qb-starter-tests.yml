name: QB starter safeguard tests

on:
  pull_request:
    paths:
      - 'live/injury_adjust.py'
      - 'tests/test_injury_adjust.py'
      - 'tools/build_game_context.py'
      - 'tests/test_qb_game_context.py'
      - 'live/qb_starter_adjust.py'
      - 'tests/test_qb_starter_adjust.py'
      - '.github/workflows/qb-starter-tests.yml'
  push:
    branches:
      - 'feature/qb-starter-verification-20261105'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-qb-starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run QB injury safeguard regression tests
        run: |
          python -m unittest discover -s tests -p 'test_injury_adjust.py' -v
          python -m unittest discover -s tests -p 'test_qb_game_context.py' -v
          python -m unittest discover -s tests -p 'test_qb_starter_adjust.py' -v
