name: Position Matchup Challenger Backtest
on:
  workflow_dispatch:
  push:
    branches:
      - research/challenger-metrics-2026
    paths:
      - '.github/workflows/position-matchup-backtest.yml'
permissions:
  contents: read
jobs:
  matchup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout existing V3 research implementation
        uses: actions/checkout@v4
        with:
          ref: research/v3-challenger
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical data requirements
        run: python -m pip install -r requirements-backtest.txt
      - name: Run prior-week position-specific matchup backtest
        run: python -m research.position_matchup
      - name: Archive paired comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: position-matchup-2024-2025
          path: research/position-matchup/
          if-no-files-found: warn
