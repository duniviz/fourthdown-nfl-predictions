name: Validate starter feed
on:
  pull_request:
    paths:
      - 'scripts/refresh_starters.py'
      - 'live/player_research.py'
      - 'live/projection_audit.py'
      - 'tests/test_replacement_starter_safeguards.py'
      - '.github/workflows/starter-feed-validation.yml'
  push:
    branches:
      - research/replacement-starter-workload-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backtest.txt
      - name: Run Python test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Check live ESPN depth chart
        run: |
          python - <<'PY'
          from scripts.refresh_starters import fetch_espn_teams, fetch_depth_chart, collect_depth_rows
          teams = fetch_espn_teams()
          assert len(teams) >= 30, f"Only {len(teams)} ESPN teams"
          successes = []
          for team in ('MIN', 'KC', 'BUF'):
              if team not in teams:
                  continue
              payload, url = fetch_depth_chart(teams[team])
              rows = collect_depth_rows(payload)
              print(team, url, {pos: len(names) for pos, names in rows.items()})
              if all(rows[p] for p in ('QB','RB','WR','TE')):
                  successes.append(team)
          assert successes, "ESPN depth charts did not return readable QB, RB, WR, and TE positions"
          PY
